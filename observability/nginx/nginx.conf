# The monitoring proxy in UAT (deploy/deploy_common.yaml, project ai-threatgen); the laptop needs no proxy.
# OpenShift gives a web address to one project only, so the Routes for /grafana and /flower on the API's address
# are in ai-threatgen and point here. nginx forwards them, path unchanged, to TSG's Grafana and Flower in ai-common.
# It runs as any user: everything it writes is under /tmp, and its errors go to the pod log.
# It looks each address up once, at start: after a Service in ai-common is created again, restart this pod.

worker_processes 1;
daemon off;
pid /tmp/nginx.pid;
error_log stderr warn;

events {
    worker_connections 512;
}

http {
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    # Request bodies up to 64k (Grafana's queries) stay in memory and answers pass straight on, never through a
    # temp file (each spill is a warn line in Loki); a connection a network rule blocks fails in 5 s with an error
    # line, not silently at the router's 30 s timeout.
    client_body_buffer_size 64k;
    proxy_max_temp_file_size 0;
    proxy_connect_timeout 5s;

    # Grafana Live keeps a websocket open: pass the upgrade on, and close plain requests as usual.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        "" close;
    }

    server {
        listen 8080;

        proxy_http_version 1.1;
        proxy_set_header Host $host;  # Grafana refuses a change whose Origin is not its own address
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        location = /healthz {
            return 200 "ok\n";
        }

        # No path after the port: each program gets the path as it came (they serve under /grafana and /flower).
        location /grafana {
            proxy_pass http://grafana.ai-common.svc.cluster.local:3000;
        }

        location /flower {
            proxy_pass http://flower.ai-common.svc.cluster.local:5555;
        }

        location / {
            return 404;
        }
    }
}
