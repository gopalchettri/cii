# Prometheus on a developer laptop (scripts/monitoring.py). Same rules and paths as UAT (prometheus.yml);
# only the targets differ: everything runs on this machine, on the ports docs/RUNNING.md uses.

global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - rules.yml

alerting:
  alertmanagers:
    - path_prefix: /alertmanager
      static_configs:
        - targets: ["localhost:9093"]

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["localhost:8000"]
  - job_name: worker # CII_WORKER_METRICS_PORT: the main worker, and the maintenance, mapper and reaper workers (run.ps1)
    static_configs:
      - targets: ["localhost:9100", "localhost:9102", "localhost:9103", "localhost:9104"]
  - job_name: flower
    metrics_path: /flower/metrics
    static_configs:
      - targets: ["localhost:5555"]
        labels: { ui_url: "http://localhost:5555/flower/" } # the dashboard's Flower link opens this
  - job_name: redis-exporter
    static_configs:
      - targets: ["localhost:9121"]
  - job_name: alloy # ships the log files to Loki
    static_configs:
      - targets: ["localhost:12345"]
  - job_name: loki
    static_configs:
      - targets: ["localhost:3100"]
  - job_name: alertmanager
    metrics_path: /alertmanager/metrics
    static_configs:
      - targets: ["localhost:9093"]
  - job_name: prometheus
    metrics_path: /prometheus/metrics
    static_configs:
      - targets: ["localhost:9090"]
