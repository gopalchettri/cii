# Prometheus in UAT / production (OpenShift). The laptop uses prometheus.local.yml: same rules, same paths.
#
# Every pod in the app's two projects (ai-threatgen, ai-remediation) that carries the annotations below is
# scraped, one target per pod:
#   prometheus.io/scrape: "true"
#   prometheus.io/port:   "<a containerPort the pod declares>"   (api 8000, worker 9100, flower 5555 …)
#   prometheus.io/path:   "/metrics"                               (flower: /flower/metrics)
# and `app.kubernetes.io/component` becomes the `job` label (api, worker, flower, loki …).
# Prometheus runs with --web.external-url=https://<host>/prometheus/, so its own pages live under /prometheus.

global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - rules.yml

alerting:
  alertmanagers:
    - path_prefix: /alertmanager
      static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: pods
    kubernetes_sd_configs:
      - role: pod
        namespaces: # the app's two projects; a namespaced Role in each allows nothing more
          names: [ai-threatgen, ai-remediation]
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        regex: "true"
        action: keep
      - source_labels: [__meta_kubernetes_pod_phase]
        regex: Running
        action: keep
      # One target per pod: keep only the declared port that the annotation names (a pod with two ports
      # would otherwise be scraped twice).
      - source_labels: [__meta_kubernetes_pod_container_port_number]
        target_label: __meta_kubernetes_pod_annotation_prometheus_io_port
        action: keepequal
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        regex: (.+)
        target_label: __metrics_path__
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
        target_label: job
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod

  # Its own job: kube-state-metrics reports OTHER pods, so their pod/namespace labels must win (honor_labels)
  # over the labels of the kube-state-metrics pod itself.
  - job_name: kube-state-metrics
    honor_labels: true
    static_configs:
      - targets: ["kube-state-metrics:8080"]

  - job_name: prometheus
    metrics_path: /prometheus/metrics
    static_configs:
      - targets: ["localhost:9090"]
