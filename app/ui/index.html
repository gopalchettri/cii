<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Threat Scenario Generator</title>
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to the page</a>

  <div id="app" class="app">
    <aside id="sidebar" class="sidebar" aria-label="Main menu">
      <div class="sidebar-brand">
        <span class="brand-mark" aria-hidden="true">TSG</span>
        <span class="brand-text">
          <strong>Threat Scenario</strong>
          <span>Generator</span>
        </span>
      </div>
      <nav id="nav" class="nav" aria-label="Pages"></nav>
      <div class="sidebar-foot">
        <span id="environment" class="environment"></span>
        <a class="sidebar-link" href="/docs" target="_blank" rel="noopener">API documentation</a>
      </div>
    </aside>

    <div class="workspace">
      <header class="topbar">
        <button id="menu-button" type="button" class="quiet menu-button" aria-controls="sidebar" aria-expanded="false">Menu</button>
        <div id="topbar-context" class="topbar-context"></div>
        <div id="account" class="account" role="group" aria-label="Signed in as"></div>
      </header>

      <main id="main" tabindex="-1">
        <div class="page-head">
          <div>
            <h1 id="page-title">Threat Scenario Generator</h1>
            <p id="page-subtitle" class="page-subtitle" hidden></p>
          </div>
          <div id="page-actions" class="page-actions"></div>
        </div>
        <div id="page">
          <noscript><p class="state state-error">This page needs JavaScript.</p></noscript>
        </div>
      </main>
    </div>
  </div>

  <div id="notices" class="notices" aria-live="polite"></div>
</body>
</html>
