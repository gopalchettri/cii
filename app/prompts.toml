- "Expired, borrowed or forged ticket use" -> ["travelling on an expired, borrowed or forged ticket"]
- "Pickpocketing or bag snatching" -> ["pickpocketing or snatching a bag"]
- "Mailbox theft or vandalism" -> ["stealing from or vandalising a mailbox"]
- "Stamp, coin or banknote forgery" -> ["forging stamps, coins or banknotes"]
Return {"actions": ["..."]}.
