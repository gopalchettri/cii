[scenario.threat_actions]
text = '''
Split the THREAT's name into the concrete acts the attacker carries out, each a short verb phrase saying what the attacker does to what. Turn a noun such as "fraud", "theft" or "extortion" into the act itself. Give no more acts than the name states.
- Each act the name joins with "and" or "with" is one act; two names for the same act are one act.
- Words before an act that only describe its target, account or means (a list such as "expired, borrowed or forged") are not acts: they stay with the one act they describe.
- Alternatives joined by "or" are one act: keep them together in one phrase.
Examples (invented, from other fields):
