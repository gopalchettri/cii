[project]
name = "cii-tsg"
version = "0.1.0"
description = "Threat Scenario Generator v2"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142",  # fastapi.sse (built-in Server-Sent Events)
    "uvicorn[standard]>=0.30",
    "celery[redis]>=5.4",
    "redis>=5.0",
    "pymongo>=4.8",
    "pyodbc>=5.1",
    "sqlalchemy>=2.0",
    "litellm>=1.50",
    "numpy>=1.26",
    "pydantic-settings>=2.4",
    "structlog>=24.1",
    "prometheus-client>=0.20",
    "flower>=2.0",
    "httpx>=0.27",  # external intelligence sources are read over HTTPS
]

[project.optional-dependencies]
local = ["sentence-transformers>=3.0"]   # dev only: local reranker model
dev = ["pytest>=8", "httpx>=0.27", "mypy>=1.11", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.format]
# The owner's prompts, word for word (trailing space included): the formatter stripped it (G245).
exclude = ["app/engine/scenarios/writing/writing_prompts.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "W605"]  # W605: a stray backslash ("IT\OT") is an error later
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
