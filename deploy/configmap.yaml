# configmap.yaml - every ConfigMap TSG needs on OpenShift (UAT is production).
#   1. tsg-config: the app's plain (non-secret) settings, the same in ai-threatgen and ai-common.
#   2. The monitoring's config files (Prometheus, Alertmanager, Loki, Alloy, Grafana), all in ai-common, and the
#      monitoring proxy's (nginx: Grafana and Flower on the API's address), in ai-threatgen.
# Passwords, keys and connection strings are NOT here: they are in secrets.yaml.
# Apply:  oc apply -f deploy/configmap.yaml
# A running pod never sees a changed setting: after a change, restart TSG's pods in each project (the -l leaves
# every other Deployment alone: v1's in ai-threatgen, the chatbot's in ai-common):
#   oc -n ai-threatgen rollout restart deployment -l part-of=tsg
#   oc -n ai-threatgen rollout status deployment -l part-of=tsg --timeout=10m
#   oc -n ai-common rollout restart deployment -l part-of=tsg-monitoring
#   oc -n ai-common rollout status deployment -l part-of=tsg-monitoring --timeout=10m
#   oc -n ai-common rollout restart deployment/worker-reaper
#   oc -n ai-common rollout status deployment/worker-reaper --timeout=10m
#   oc -n ai-threatgen rollout restart deployment/monitoring-proxy
#   oc -n ai-threatgen rollout status deployment/monitoring-proxy --timeout=10m
# Step by step: deploy/DEPLOYMENT_GUIDE.md

# ---------------------------------------------------------------- 1. the app's settings (tsg-config)
apiVersion: v1                                   # core API version
kind: List                                       # several objects in one document, so the settings are written once
items:                                           # one tsg-config per project that runs TSG pods
  - apiVersion: v1                               # core API version
    kind: ConfigMap                              # plain, non-secret settings
    metadata:                                    # the object's name and place
      name: tsg-config                           # the name every TSG pod reads its settings from (envFrom)
      namespace: ai-threatgen                    # the API, beat and every worker but the reaper's run here
      labels: { part-of: tsg }                   # marks it as TSG's
    data: &settings                              # "&settings" names this block: ai-common's copy below reuses it unchanged
      CII_ENV: "uat"                             # environment name; anything but "dev" gets production's safety checks
      CII_CORS_ORIGINS: "https://threatgen-api.apps.dda-desc-az1-01.desccii.local"   # the platform UI's https address(es), comma-separated; "*" stops start-up
      CII_MONGO_DB: "cii_uat"                    # MongoDB database that holds every run, scenario, plan and job
      CII_REDIS_CA_FILE: ""                      # the CA file that signed Redis' TLS certificate, if a private CA did (mount it); "" = the image's trusted CAs
      # Each module's own chat model (.env.example explains every line; its key is in tsg-secrets). Its limits are
      # its own: kimi-k2.5 (192 requests a minute on this key) serves threat scenarios alone; glm-5.3 serves
      # remediation and the service mapper and is threat scenarios' backup: at most 16 glm-5.3 calls at once in all
      # (10 + 4 + 2; it takes 55-99 s a call: ask the gateway admin how many it takes). A line left out = its default.
      CII_SCENARIO_CHAT_BASE_URL: "https://llmapi.govai.ae"           # threat finding and scenario writing: the AI gateway its chat calls go to
      CII_SCENARIO_CHAT_MODEL: "litellm_proxy/kimi-k2.5"              # its main chat model
      CII_SCENARIO_CHAT_MODEL_THINKING: "false"                       # false = the model's "thinking" mode off (faster)
      CII_SCENARIO_CHAT_MAX_INPUT_TOKENS: "114688"                    # kimi-k2.5: longest question in tokens (the gateway's limit)
      CII_SCENARIO_CHAT_MAX_OUTPUT_TOKENS: "12288"                    # kimi-k2.5: longest answer in tokens
      CII_SCENARIO_CHAT_TIMEOUT_SECONDS: "120"                        # kimi-k2.5: seconds to wait for one answer before giving up
      CII_SCENARIO_CHAT_REQUESTS_PER_MINUTE: "180"                    # kimi-k2.5 requests a minute, all pods: its own limit is 192
      CII_SCENARIO_CHAT_TOKENS_PER_MINUTE: "0"                        # kimi-k2.5 tokens a minute (question + answer room), all pods: set it a little below the budget a 429 names (ai.call_unavailable limit); 0 = no limit
      CII_SCENARIO_MAX_CONCURRENT_AI_CALLS: "16"                      # its questions at the same time, all pods: 16 kept UAT fast until 24 Oct; it also backs off after a 429
      CII_SCENARIO_CHAT_FALLBACK_MODEL: "litellm_proxy/glm-5.3"       # its backup when kimi-k2.5 keeps failing; "" = none
      CII_SCENARIO_CHAT_FALLBACK_MODEL_THINKING: "false"              # the backup's thinking mode
      CII_SCENARIO_CHAT_FALLBACK_MAX_INPUT_TOKENS: "262144"           # the backup glm-5.3: longest question in tokens (the gateway's limit)
      CII_SCENARIO_CHAT_FALLBACK_MAX_OUTPUT_TOKENS: "12288"           # the backup glm-5.3: longest answer in tokens
      CII_SCENARIO_CHAT_FALLBACK_TIMEOUT_SECONDS: "180"               # the backup glm-5.3: seconds to wait for one answer before giving up
      CII_SCENARIO_CHAT_FALLBACK_REQUESTS_PER_MINUTE: "0"             # glm-5.3 requests a minute, all pods; 0 = no limit until the gateway admin gives glm-5.3's
      CII_SCENARIO_MAX_CONCURRENT_FALLBACK_CALLS: "10"                # its calls at once to glm-5.3, all pods
      CII_REMEDIATION_CHAT_BASE_URL: "https://llmapi.govai.ae"        # remediation plans: the AI gateway its chat calls go to
      CII_REMEDIATION_CHAT_MODEL: "litellm_proxy/glm-5.3"             # its main chat model
      CII_REMEDIATION_CHAT_MODEL_THINKING: "false"                    # false = the model's "thinking" mode off (faster)
      CII_REMEDIATION_CHAT_MAX_INPUT_TOKENS: "262144"                 # glm-5.3: longest question in tokens (the gateway's limit)
      CII_REMEDIATION_CHAT_MAX_OUTPUT_TOKENS: "12288"                 # glm-5.3: longest answer in tokens
      CII_REMEDIATION_CHAT_TIMEOUT_SECONDS: "180"                     # glm-5.3: seconds to wait for one answer before giving up
      CII_REMEDIATION_CHAT_REQUESTS_PER_MINUTE: "0"                   # glm-5.3 requests a minute, all pods; 0 = no limit until the gateway admin gives glm-5.3's
      CII_REMEDIATION_MAX_CONCURRENT_AI_CALLS: "4"                    # its calls at once to glm-5.3, all pods
      CII_REMEDIATION_CHAT_FALLBACK_MODEL: ""                         # "" = no backup: a job glm-5.3 cannot answer is tried again later
      CII_SERVICE_MAPPER_CHAT_BASE_URL: "https://llmapi.govai.ae"     # the service mapper: the AI gateway its chat calls go to
      CII_SERVICE_MAPPER_CHAT_MODEL: "litellm_proxy/glm-5.3"          # its main chat model
      CII_SERVICE_MAPPER_CHAT_MODEL_THINKING: "false"                 # false = the model's "thinking" mode off (faster)
      CII_SERVICE_MAPPER_CHAT_MAX_INPUT_TOKENS: "262144"              # glm-5.3: longest question in tokens (the gateway's limit)
      CII_SERVICE_MAPPER_CHAT_MAX_OUTPUT_TOKENS: "12288"              # glm-5.3: longest answer in tokens
      CII_SERVICE_MAPPER_CHAT_TIMEOUT_SECONDS: "180"                  # glm-5.3: seconds to wait for one answer before giving up
      CII_SERVICE_MAPPER_CHAT_REQUESTS_PER_MINUTE: "0"                # glm-5.3 requests a minute, all pods; 0 = no limit until the gateway admin gives glm-5.3's
      CII_SERVICE_MAPPER_MAX_CONCURRENT_AI_CALLS: "2"                 # its calls at once to glm-5.3, all pods
      CII_SERVICE_MAPPER_CHAT_FALLBACK_MODEL: ""                      # "" = no backup: a job glm-5.3 cannot answer is tried again later
      # Answer room per task, in tokens: the AI service counts it against its budget while a question runs; an
      # answer that needs more is asked once more with the model's full room.
      CII_ANSWER_TOKENS_RELEVANCE_GATE: "4096"                        # threat finding: is each threat relevant (about 180 a threat)
      CII_ANSWER_TOKENS_GAP_FILL: "1024"                              # threat finding: a threat for a STRIDE kind that found none
      CII_ANSWER_TOKENS_THREAT_ACTIONS: "1024"                        # scenario writing: the actions a threat's name states
      CII_ANSWER_TOKENS_WRITE_SCENARIO: "3072"                        # scenario writing: one scenario
      CII_ANSWER_TOKENS_REPAIR_SCENARIO: "3072"                       # scenario writing: a scenario written again after a check
      CII_ANSWER_TOKENS_PLAN_CHECK: "2048"                            # scenario writing: does the scenario carry out its plan
      CII_ANSWER_TOKENS_REMEDIATION_PLAN: "8192"                      # remediation: one treatment plan (about 140 a control)
      CII_ANSWER_TOKENS_SERVICE_MAPPER: "4096"                        # service mapper: one mapping
      CII_THREAT_QUESTIONS_AT_ONCE: "8"                               # threat finding: questions sent at the same time, per run
      CII_THREATS_PER_QUESTION: "10"                                  # threat finding: threats checked in one question
      CII_SCENARIOS_WRITTEN_AT_ONCE: "6"                              # scenario writing: scenarios written at the same time, per job
      CII_RERANKS_AT_ONCE: "6"                                        # search: reranker calls at the same time, per worker
      CII_AI_BUSY_MAX_WAIT_SECONDS: "60"                              # after "too busy" (HTTP 429): longest wait before asking the same model again
      CII_AI_BUSY_TOTAL_WAIT_SECONDS: "60"                            # after "too busy": most seconds waited in all (4 retries at most), then the backup model
      CII_AI_MODEL_COOL_DOWN_SECONDS: "120"                           # seconds a refused model is tried last (its backup goes first)
      CII_AI_BUSY_LIMIT_FLOOR: "4"                                    # after "too busy": the fewest questions still allowed at the same time
      CII_AI_BUSY_LIMIT_SECONDS: "180"                                # seconds that slow-down lasts after the last "too busy"; a whole number
      CII_EMBEDDING_BASE_URL: "https://llmapi.govai.ae"            # the AI gateway for embeddings (text to vectors)
      CII_EMBEDDING_MODEL: "litellm_proxy/qwen3-embedding-8b"      # embedding model for the library searches
      CII_RERANK_BASE_URL: "https://llmapi.govai.ae"               # the AI gateway for re-ranking search results
      CII_RERANK_MODEL: "litellm_proxy/qwen3-reranker-8b"          # re-ranking model
      CII_AI_KEY_HEADER: "x-litellm-api-key"     # header the gateway reads the AI key from
      CII_AI_BYPASS_PROXY: "true"                # must stay true: AI calls go to the gateway directly, not via the proxy
      CII_WORKER_METRICS_PORT: "9100"            # port each worker serves /metrics on for Prometheus
      CII_MAX_REQUEST_MB: "2"                    # largest request body the API accepts, in MB
      CII_MAX_CONCURRENT_AI_CALLS: "0"           # 0 = no fixed limit (the owner's choice for UAT): TSG backs off by itself only after a gateway 429 (one limit for all pods, halved at a 429, raised again by each answer, gone a few minutes after the last 429); above 0 = a fixed ceiling on the search calls (embedding, re-ranking) at once across all pods. Each module's chat calls: its own limit above
      CII_EMBEDDING_REQUESTS_PER_MINUTE: "0"         # embedding requests a minute, all pods; 0 = no limit: set it when the gateway admin gives its limit
      CII_RERANK_REQUESTS_PER_MINUTE: "0"            # the same for the re-ranking model; 0 = no limit: set it when the gateway admin gives its limit
      CII_LOG_LEVEL: "INFO"                      # log detail: DEBUG, INFO, WARNING or ERROR (DEBUG only for a short check)
      TOTAL_SCENARIO_COUNT: "15"                 # most scenarios a run produces
      INITIAL_SET_SIZE: "6"                      # scenarios written first, so a reviewer can start reading
      NEXT_SET_SIZE: "6"                         # scenarios written by each "next set" call
      REGENERATIONS_MAX_VERSION_COUNT: "10"      # versions kept per remediation plan (first plan + 9 regenerations)
      SERVICE_MAPPER_UPSTREAM_TOTAL_COUNT: "10"      # upstream services the service mapper asks the AI for (0 = off)
      SERVICE_MAPPER_DOWNSTREAM_TOTAL_COUNT: "10"    # downstream services the service mapper asks the AI for (0 = off)
      SERVICE_MAPPER_MAX_GENERATIONS: "5"            # runs per mapping, the first included (Generate, then Generate again or Regenerate); 0 = no limit
      ASSET_PROPERTIES_REQUIRED: ""              # asset facts a run must have, comma-separated (empty = none)
      SYSTEM_PROPERTIES_REQUIRED: ""             # supporting-system facts a run must have (empty = none)
      CONTROL_SIMILARITY_THRESHOLD: "50"         # how close a library control must be to a scenario to be kept
      CONTROL_CANDIDATES: "40"                   # library controls searched per scenario (required: no default)
      MIN_CONTROLS: "3"                          # fewest controls kept per scenario
      MAX_CONTROLS: "15"                         # most controls kept per scenario
      NEAREST_CONTROLS: "3"                      # controls kept when none is close enough
      THREAT_SCENARIO_WORD_LIMIT: "150-200"      # words asked for per scenario statement (min-max)
      RISK_STATEMENT_WORD_LIMIT: "100-150"       # words asked for per risk statement (min-max)
      EVIDENCE_STATEMENT_WORD_LIMIT: "20-60"     # words asked for per evidence passage (min-max)
      THREAT_SIMILARITY_THRESHOLD: "60"          # how close an AI-proposed threat must be to count as a library threat
      EXTERNAL_INTELLIGENCE_ENABLED: "true"      # use the outside intelligence feeds (CISA, NVD ...) as evidence
      EVIDENCE_SIMILARITY_THRESHOLD: "50"        # reranker score evidence must reach (required while the feeds are on)
      EVIDENCE_CANDIDATES: "30"                  # intelligence records scored per threat
      EVIDENCE_KEPT_PER_THREAT: "3"              # intelligence records kept per threat
      THREAT_CONTEXT_COUNTRY: "United Arab Emirates"   # the country the assets are in (read as a fact)
  - apiVersion: v1                               # core API version
    kind: ConfigMap                              # plain, non-secret settings
    metadata:                                    # the object's name and place
      name: tsg-config                           # the same name, read the same way
      namespace: ai-common                       # worker-reaper and Flower run here (Flower loads the settings to start)
      labels: { part-of: tsg }                   # marks it as TSG's
    data: *settings                              # "*settings" = exactly the settings written above

# ---------------------------------------------------------------- 2. the monitoring's config files (ai-common)
# Each file below is an exact copy of the one in observability/ (the laptop uses those): change both together.
# tests/test_deploy.py fails when a copy and its file differ.

# Prometheus: what to scrape and the alert rules
---
apiVersion: v1                                   # core API version
kind: ConfigMap                                  # Prometheus' config files, mounted at /etc/prometheus
metadata:                                        # the object's name and place
  name: prometheus-config                        # the name its Deployment mounts (deploy_common.yaml)
  namespace: ai-common                           # the monitoring's project
  labels: { part-of: tsg-monitoring }            # marks it as TSG's monitoring
data:                                            # one key per file
  prometheus.yml: |                              # which pods to scrape: a copy of observability/prometheus/prometheus.yml
    # Prometheus in UAT / production (OpenShift). The laptop uses prometheus.local.yml: same rules, same paths.
    #
    # Every TSG pod (pod label part-of: tsg or tsg-monitoring) in the app's project (ai-threatgen) and in
    # ai-common (the monitoring, Flower, worker-reaper) that carries the annotations below is scraped, one
    # target per pod. ai-common is shared with a chatbot: its pods are left out, whatever they carry.
    #   prometheus.io/scrape: "true"
    #   prometheus.io/port:   "<a containerPort the pod declares>"   (api 8000, worker 9100, flower 5555 …)
    #   prometheus.io/path:   "/metrics"                               (flower: /flower/metrics)
    # and the pod label `component` becomes the `job` label (api, worker, flower, loki …).
    # Prometheus runs with --web.external-url=https://<host>/prometheus/, so its own pages live under /prometheus.

    global:
      scrape_interval: 30s
      evaluation_interval: 30s

    rule_files:
      - rules.yml

    alerting:
      alertmanagers:
        - path_prefix: /alertmanager
          static_configs:
            - targets: ["alertmanager:9093"]

    scrape_configs:
      - job_name: pods
        kubernetes_sd_configs:
          - role: pod
            namespaces: # the app's project and the monitoring's; a namespaced Role in each allows nothing more
              names: [ai-threatgen, ai-common]
        relabel_configs:
          # TSG's pods only: the chatbot's pods in ai-common must not join TSG's jobs and alerts.
          - source_labels: [__meta_kubernetes_pod_label_part_of]
            regex: tsg|tsg-monitoring
            action: keep
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            regex: "true"
            action: keep
          - source_labels: [__meta_kubernetes_pod_phase]
            regex: Running
            action: keep
          # One target per pod: keep only the declared port that the annotation names (a pod with two ports
          # would otherwise be scraped twice).
          - source_labels: [__meta_kubernetes_pod_container_port_number]
            target_label: __meta_kubernetes_pod_annotation_prometheus_io_port
            action: keepequal
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            regex: (.+)
            target_label: __metrics_path__
          - source_labels: [__meta_kubernetes_pod_label_component]
            target_label: job
          # The dashboard's Flower link opens this: Flower's Route is on Grafana's own host (deploy/deploy_common.yaml).
          - source_labels: [job]
            regex: flower
            target_label: ui_url
            replacement: /flower/
          # The AI usage dashboard's report links open this: Grafana's Route is on the API's own host.
          - source_labels: [job]
            regex: api
            target_label: ui_url
            replacement: /v1/ai-usage
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          # Alerts and the dashboard name a target by instance: <project>/<pod>, not the pod's IP:port.
          - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_pod_name]
            separator: /
            target_label: instance

      # Its own job: kube-state-metrics reports OTHER pods, so their pod/namespace labels must win (honor_labels)
      # over the labels of the kube-state-metrics pod itself. It reports every pod of the two projects: keep
      # only the pods of TSG's own Deployments (v1 also runs in ai-threatgen, a chatbot in ai-common)
      # (<deployment>-<replicaset hash>-<5 characters>). tests/test_observability.py checks the names.
      - job_name: kube-state-metrics
        honor_labels: true
        static_configs:
          - targets: ["kube-state-metrics:8080"]
        metric_relabel_configs:
          - source_labels: [namespace, pod]
            regex: "ai-threatgen;(api|worker-threats|worker-scenarios|worker-controls|worker-remediation|worker-service-mapper|worker-maintenance|beat|monitoring-proxy)-[a-z0-9]+-[a-z0-9]{5}|ai-common;(prometheus|alertmanager|loki|alloy|grafana|redis-exporter|kube-state-metrics|flower|worker-reaper)-[a-z0-9]+-[a-z0-9]{5}"
            action: keep

      - job_name: prometheus
        metrics_path: /prometheus/metrics
        static_configs:
          - targets: ["localhost:9090"]
  rules.yml: |                                   # the alert rules: a copy of observability/prometheus/rules.yml
    # TSG alerts (docs/BLUEPRINT.md §22.3). Every expression uses a metric that exists today: tests/test_observability.py
    # checks each name against the app's metrics, and rules.test.yml proves each alert fires.
    # summary = what is wrong, in plain words; description = what to do. Both show on the TSG dashboard and in
    # Grafana Alerting. Planned with its metric: IntelStale (M12).
    # Firing alerts are emailed (observability/alertmanager/alertmanager.yml) and show in Grafana (home dashboard,
    # Alerting) and at /alertmanager.

    groups:
      - name: tsg-api
        rules:
          - alert: Api5xxHigh
            # Probes excluded from both sides: /ready answers 503 on purpose when a store or worker is missing
            # (NoWorker / MongoDown … report that), and its 200s would hide real errors at low traffic.
            expr: >
              sum(rate(tsg_http_requests_total{status=~"5..", route!~"/health|/ready|/metrics"}[5m]))
              / sum(rate(tsg_http_requests_total{route!~"/health|/ready|/metrics"}[5m])) > 0.02
            for: 10m
            labels: { severity: warning }
            annotations:
              summary: More than 2 % of API answers are server errors (5xx).
              description: Open the TSG dashboard, table "API calls that went wrong", to see which calls and why.

          # 500 = an error nobody expected (a bug); an outage answers 503 and is reported by its own alert.
          - alert: ApiCrashing
            expr: sum(increase(tsg_http_requests_total{status="500"}[10m])) > 0
            for: 1m
            labels: { severity: warning }
            annotations:
              summary: The API hit an unexpected error (a bug) on {{ $value | printf "%.0f" }} calls in 10 minutes.
              description: >-
                Open the TSG dashboard, table "Errors and exceptions": click the request id for the whole story and
                the traceback.

          - alert: ApiLatencyHigh
            expr: >
              histogram_quantile(0.95,
                sum by (le) (rate(tsg_http_request_seconds_bucket{route!~"/health|/ready|/metrics"}[5m]))) > 1
            for: 10m
            labels: { severity: warning }
            annotations:
              summary: The API is slow; 95 % of calls should finish within 1 s and have not for 10 minutes.
              description: Open the TSG dashboard, "What is slow", to see which pages; check the stores' tiles too.

      - name: tsg-jobs
        rules:
          # Every `failure` outcome of a run job is final: a retry is counted as `retry`, so a failure is either
          # "failed after Lease.MAX_ATTEMPTS outage retries" or an unexpected error. Both leave a user with a failed
          # run. The timer jobs are left out: a failed reaper pass, control-mapping sweep or scheduled intel refresh
          # simply runs again on its timer (ReaperNotRunning and ReaperFailing watch the reaper). An index build
          # counts: an admin may
          # have asked for it.
          - alert: JobsFailing
            expr: sum by (task) (increase(tsg_jobs_total{outcome="failure",task!~"tsg_reap|tsg_retry_controls|tsg_refresh_external_intelligence"}[15m])) > 0
            for: 1m
            labels: { severity: warning }
            annotations:
              summary: "{{ $labels.task }} jobs failed for good in the last 15 minutes."
              description: Open the TSG dashboard, table "Failed jobs", for why; click the run id for its whole story.

          # A retry is an outage the job waits out (the AI, MongoDB or Redis): many of them mean runs crawl, and
          # each one ends in JobsFailing after Lease.MAX_ATTEMPTS.
          - alert: JobsRetrying
            expr: sum by (task) (increase(tsg_jobs_total{outcome="retry"}[15m])) >= 5
            for: 5m
            labels: { severity: warning }
            annotations:
              summary: "{{ $labels.task }} jobs were sent back to retry 5 times or more in 15 minutes."
              description: Something keeps failing for them. Open the TSG dashboard, "Why the AI did not answer" and the stores' tiles.

          # Due jobs waiting for a free worker thread (tsg_job_queue_wait_seconds), by job type.
          - alert: JobQueueWaitHigh
            expr: histogram_quantile(0.95, sum by (le, task) (rate(tsg_job_queue_wait_seconds_bucket[15m]))) > 300
            for: 10m
            labels: { severity: warning }
            annotations:
              summary: "{{ $labels.task }} jobs have waited more than 5 minutes for a worker (95 %) for 10 minutes."
              description: The workers cannot keep up. Check that its worker is running; if it is busy, raise its threads (-c in deploy_threatgen.yaml), as the quota has no room for a second copy.

          # Beat sends the reaper every minute. Without it (the beat pod gone or hung), a job whose worker died stays
          # running and a lost message stays queued for ever, and nothing else notices: /ready does not cover beat.
          # The age of the last start, not a rise in tsg_jobs_total: the first pass after a start comes before
          # Prometheus' first scrape, so a rise was never seen and every start showed this for a minute. Only the
          # worker that runs the reaper exports it, from its first pass on; none for 10 minutes (that worker gone,
          # or restarted and never sent the reaper) is the same problem. Passes that start but fail: ReaperFailing.
          - alert: ReaperNotRunning
            expr: >-
              time() - max(tsg_reaper_last_start_timestamp_seconds) > 600
              or absent_over_time(tsg_reaper_last_start_timestamp_seconds[10m])
            for: 5m
            labels: { severity: critical }
            annotations:
              summary: The scheduler (Celery beat) has not run the reaper for 15 minutes; stuck jobs are not repaired.
              description: "Laptop: .\\run.ps1 status, then start again. UAT: check the beat pod (oc get pods)."

          # Each process measures its clock against MongoDB's and corrects itself (app/core/clock.py), so jobs still
          # start. A pod far off means its node's time sync is broken: before the shared clock, a worker 76 s behind
          # dropped every job as "not due" and runs failed "sent 5 times and never started" (UAT, 2026-10-24).
          - alert: ClockSkew
            expr: max by (instance) (abs(tsg_clock_offset_seconds)) > 5
            for: 5m
            labels: { severity: warning }
            annotations:
              summary: "{{ $labels.instance }}'s clock is more than 5 s off MongoDB's; the app corrects for it."
              description: "UAT: the cluster admin fixes time sync on its node: oc debug node/<node> -- chroot /host chronyc tracking."

          # Each queue is two Redis lists: <Worker.BROKER_KEY_PREFIX><queue> (a run's next stages), i.e.
          # tsg:tsg_threats, and the same name + "\x06\x163" (new work, Worker.NEW_WORK_PRIORITY); summed per queue.
          # Every queue but tsg_maintenance, so a new queue is covered without an edit here.
          - alert: QueueBacklog
            expr: sum by (queue) (label_replace(max by (key) (redis_key_size{key=~"tsg:tsg_.*", key!~"tsg:tsg_maintenance.*"}), "queue", "$1", "key", "tsg:([a-z_]+).*")) > 50
            for: 15m
            labels: { severity: warning }
            annotations:
              summary: "{{ $labels.queue }} has held more than 50 waiting jobs for 15 minutes."
              description: The workers cannot keep up. Check that its worker is WORKING; add a worker if it is.

          # redis-exporter answers even when it cannot reach Redis; then queue lengths vanish and QueueBacklog
          # can never fire. Say so instead of staying silent.
          - alert: QueueDepthUnknown
            expr: max(redis_up) == 0
            for: 10m
            labels: { severity: warning }
            annotations:
              summary: The monitoring cannot read Redis, so the number of waiting jobs is unknown.
              description: Check redis-exporter's broker address (CII_REDIS_CELERY_BROKER_URL) and that Redis is up.

          - alert: NoWorker
            expr: max by (queue) (tsg_workers_online) == 0
            for: 2m
            labels: { severity: critical }
            annotations:
              summary: No worker is taking {{ $labels.queue }} jobs; they wait until one starts.
              description: "Laptop: .\\run.ps1 start (or check the worker's window). UAT: check the worker pods."

      # Jobs that never ran or never ended: the job outcomes alone cannot show them.
      - name: tsg-jobs-unfinished
        rules:
          # Beat sends the reaper (ReaperNotRunning is quiet) but no pass ends: each fails (MongoDB down) or hangs.
          # A pass that never finished is exported nowhere, so none for 10 minutes counts too.
          - alert: ReaperFailing
            expr: >-
              (time() - max(tsg_reaper_last_pass_timestamp_seconds) > 600
              or absent_over_time(tsg_reaper_last_pass_timestamp_seconds[10m]))
              and time() - max(tsg_reaper_last_start_timestamp_seconds) <= 600
            for: 5m
            labels: { severity: critical }
            annotations:
              summary: The reaper starts but no pass has finished for 15 minutes; stuck jobs are not repaired.
              description: >-
                Its passes fail or hang. Check MongoDB first (the stores' tiles); the "Errors and exceptions" table
                shows why tsg_reap failed. If nothing fails, restart the worker that runs the reaper.

          # Beat's timer messages (reaper, control-mapping sweep, index build, intel check) carry an expiry, which
          # Celery stamps on beat's clock and checks on the worker's: a beat clock behind, or a stuck worker, drops
          # them unrun. Each drop is counted as outcome="expired" (app/worker/lifecycle.py).
          - alert: ScheduledJobsExpiring
            expr: sum by (task) (increase(tsg_jobs_total{outcome="expired"}[15m])) > 0
            for: 5m
            labels: { severity: warning }
            annotations:
              summary: "{{ $labels.task }} timer jobs were dropped unrun: they reached a worker after their expiry."
              description: >-
                Check that the worker taking them is not stuck or too busy, then the clock of beat's node against
                the workers': oc debug node/<node> -- chroot /host chronyc tracking.

          # A job with no lease check (AI call or wait) for Lease.STALL_SECONDS stops renewing its lease
          # (app/worker/lease_renewal.py): the reaper gives it to another worker; its thread may still hold a slot.
          - alert: JobHung
            expr: sum(increase(tsg_jobs_hung_total[1h])) > 0
            for: 1m
            labels: { severity: warning }
            annotations:
              summary: A job made no progress for 15 minutes and was stopped as hung in the last hour.
              description: >-
                Grafana Explore, Loki: {app="tsg"} |= "job.stalled" names it (record_id, task). The reaper runs it
                again on another worker; a thread still running 10 minutes later logs worker.job_hung and restarts
                its pod.

      - name: tsg-dependencies
        rules:
          # The API (each /ready and scrape) and every worker (each heartbeat) report the stores they reach: by
          # job, so the alert names which one lost it. SQL Server: the API only.
          - alert: MongoDown
            expr: min by (job) (tsg_dependency_up{name="mongo"}) == 0
            for: 3m
            labels: { severity: critical }
            annotations:
              summary: MongoDB does not answer the {{ $labels.job }}.
              description: Nothing can be read or saved. Check the MongoDB server and CII_MONGO_URL.
          - alert: SqlDown
            expr: min(tsg_dependency_up{name="sql"}) == 0
            for: 3m
            labels: { severity: critical }
            annotations:
              summary: SQL Server does not answer the API.
              description: Asset and library data cannot be read. Check the SQL Server and its connection settings.
          - alert: RedisDown
            expr: min by (job) (tsg_dependency_up{name="redis"}) == 0
            for: 3m
            labels: { severity: critical }
            annotations:
              summary: Redis does not answer the {{ $labels.job }}.
              description: Jobs cannot be queued and live updates stop. Check the Redis server.

          # Redis at its maxmemory drops keys: a queue list or the AI limiters' state can vanish with them.
          - alert: RedisEvictingKeys
            expr: sum(increase(redis_evicted_keys_total[10m])) > 0
            for: 1m
            labels: { severity: warning }
            annotations:
              summary: Redis is full and dropped keys in the last 10 minutes; waiting jobs can be lost.
              description: >-
                The reaper re-sends lost jobs, late. Ask the Redis owner for more memory (or the noeviction policy)
                and check what fills it.

          - alert: AiErrorRateHigh
            expr: sum(rate(tsg_ai_calls_total{outcome!~"ok|truncated"}[10m])) / sum(rate(tsg_ai_calls_total{outcome!="truncated"}[10m])) > 0.10
            for: 10m
            labels: { severity: warning }
            annotations:
              summary: More than 10 % of AI calls fail (no answer, or an answer that could not be used).
              description: Open the TSG dashboard, "Why the AI did not answer"; see docs/UAT_LLM_TIMEOUT_RUNBOOK.md.

          # By reason, so the alert itself says which outage it is (each has its own cure). The gateway's refusals
          # only: source="limiter" counts TSG's own limiter (no AI slot or request turn free within the wait).
          - alert: AiNotAnswering
            expr: sum by (reason) (increase(tsg_ai_outages_total{source="gateway"}[10m])) >= 3
            for: 5m
            labels: { severity: warning }
            annotations:
              summary: >-
                The AI service {{ if eq $labels.reason "ai_timed_out" }}timed out{{ else if eq $labels.reason
                "ai_busy" }}was busy{{ else if eq $labels.reason "ai_unreachable" }}could not be reached{{ else
                }}answered with a server error{{ end }} {{ $value | printf "%.0f" }} times in 10 minutes.
              description: >-
                Jobs wait and try again. Timed out or busy: the AI gateway is overloaded (docs/UAT_LLM_TIMEOUT_RUNBOOK.md).
                Cannot be reached: check the model's base URL (a module's CII_<MODULE>_CHAT_BASE_URL), the proxy and
                the network. Server error: ask the gateway's team.

          # Every worker reports the same numbers, read from Redis at each scrape (app/ai/slots.py): the AI calls in
          # flight per pool (search, each module), and its limit in force (its MAX_CONCURRENT_AI_CALLS or a 429's; 0 = none,
          # so no alert). Calls then wait for a slot, and jobs slow down or give back.
          - alert: AiSlotsSaturated
            expr: max by (pool) (tsg_ai_slots_in_use) >= max by (pool) (tsg_ai_slots_cap) and max by (pool) (tsg_ai_slots_cap) > 0
            for: 10m
            labels: { severity: warning }
            annotations:
              summary: Every AI slot of the {{ $labels.pool }} calls has been in use for 10 minutes; they wait for a free one.
              description: >-
                Jobs slow down. At the pool's limit 0 the AI gateway keeps answering 429 and TSG holds back by itself:
                ask the gateway admin for a higher limit on that key. Above 0 with no recent 429 it is the fixed
                ceiling (search: CII_MAX_CONCURRENT_AI_CALLS, lowered for a while by a 429; a module: its own
                CII_<MODULE>_MAX_CONCURRENT_AI_CALLS): raise it if the gateway can take more.

          # Every AI request waits its turn under its model's own requests-a-minute setting (app/ai/slots.py
          # AiRequestRate), so by model: a long wait means more work is sent to that model than it allows.
          - alert: AiRequestRateWaitHigh
            expr: histogram_quantile(0.95, sum by (le, model) (rate(tsg_ai_request_rate_wait_seconds_bucket[5m]))) > 30
            for: 10m
            labels: { severity: warning }
            annotations:
              summary: "{{ $labels.model }} requests have waited more than 30 s for their turn (95 %) for 10 minutes; jobs slow down."
              description: >-
                More work is sent to {{ $labels.model }} than its requests-a-minute setting allows (a module's
                CII_<MODULE>_CHAT_REQUESTS_PER_MINUTE or CII_<MODULE>_CHAT_FALLBACK_REQUESTS_PER_MINUTE,
                CII_EMBEDDING_REQUESTS_PER_MINUTE or CII_RERANK_REQUESTS_PER_MINUTE; a module's tokens:
                CII_<MODULE>_CHAT_TOKENS_PER_MINUTE). Ask the gateway admin whether that model takes more, then raise
                its setting; the dashboard's 429 panel shows refusals.

          # An AI usage row MongoDB did not take is logged whole (ai.usage_row_spilled) instead of stored (app/ai/
          # attempts.py). Loki keeps lines 7 days: replayed within them, nothing is lost.
          - alert: AiUsageNotRecorded
            expr: sum(increase(tsg_ai_usage_spilled_total[15m])) > 0
            for: 1m
            labels: { severity: warning }
            annotations:
              summary: "{{ $value | printf \"%.0f\" }} AI usage rows could not be stored in the last 15 minutes."
              description: >-
                The AI calls went on; their usage rows were logged whole as ai.usage_row_spilled. Within 7 days, export
                those lines from Loki and replay them in an app pod (ai_usage_tools; deploy/DEPLOYMENT_GUIDE.md, AI usage).

          # The hourly add-up the AI usage totals read (tsg_roll_up_ai_usage, every 5 minutes on the maintenance
          # worker); exported from its first add-up, never as a 0. Per-request reports never wait for it.
          - alert: AiUsageRollupBehind
            expr: >-
              time() - max(tsg_ai_usage_rollup_last_success_timestamp_seconds) > 900
              or absent_over_time(tsg_ai_usage_rollup_last_success_timestamp_seconds[20m])
            for: 5m
            labels: { severity: warning }
            annotations:
              summary: The AI usage totals have not been added up for 15 minutes; dashboards show old totals.
              description: >-
                No rows are lost: the next add-up catches up. Check the beat pod and the maintenance worker, and its
                ai.usage_rollup_done lines.

      - name: tsg-audit
        rules:
          - alert: AuditWriteFailing
            expr: sum(increase(tsg_audit_failures_total[15m])) > 0
            for: 5m
            labels: { severity: critical }
            annotations:
              summary: Audit records could not be written to tsg_audit (the actions still happened).
              description: Check MongoDB; the "Errors and exceptions" table shows each audit.write_failed line.

      - name: tsg-library
        rules:
          - alert: LibraryCheckFailing
            expr: sum(increase(tsg_library_check_failures_total[15m])) >= 10
            for: 5m
            labels: { severity: warning }
            annotations:
              summary: The library check keeps failing, so library edits in SQL Server are not picked up (the last loaded library is still served).
              description: Check SQL Server; the "Errors and exceptions" table shows each library.check_failed line.

      - name: tsg-logs
        rules:
          # Alloy gives up on a batch after its retries; Loki refuses lines too old, too long or over its rate. Both
          # are up, so TargetDown is quiet. Loki makes its counter at its first refusal, already above 0, which
          # increase() cannot see: a counter new in the last 15 minutes counts too.
          - alert: LogLinesLost
            expr: >-
              sum(increase(loki_write_dropped_entries_total[15m])) > 0
              or sum(increase(loki_discarded_samples_total[15m])) > 0
              or count(loki_write_dropped_entries_total > 0 unless loki_write_dropped_entries_total offset 15m)
              or count(loki_discarded_samples_total > 0 unless loki_discarded_samples_total offset 15m)
            for: 1m
            labels: { severity: warning }
            annotations:
              summary: Log lines were lost on the way to Loki in the last 15 minutes; the log panels miss them.
              description: >-
                Alloy's and Loki's own logs say why: Loki down, or refusing lines (too old, too long, over its rate).
                UAT: oc -n ai-common logs deployment/alloy, then deployment/loki.

      - name: tsg-platform
        rules:
          - alert: TargetDown
            expr: up == 0
            for: 10m
            labels: { severity: warning }
            annotations:
              summary: Prometheus cannot read {{ $labels.job }} at {{ $labels.instance }}.
              description: That program is stopped or unreachable; its numbers on the dashboard are missing.

          # A component with no running pod has no scrape target, so TargetDown cannot see it: these can.
          - alert: ApiNotRunning
            expr: absent(up{job="api"} == 1)
            for: 5m
            labels: { severity: critical }
            annotations:
              summary: No API instance is running and answering.
              description: "Nobody can use the app. Laptop: .\\run.ps1 start. UAT: check the api pods."

          - alert: WorkerNotRunning
            expr: absent(up{job="worker"} == 1)
            for: 5m
            labels: { severity: critical }
            annotations:
              summary: No worker process is running and answering.
              description: "No background job runs. Laptop: .\\run.ps1 start. UAT: check the worker pods."

          - alert: PodNotStarting
            expr: >
              max by (namespace, pod) (kube_pod_container_status_waiting_reason{
                reason=~"CrashLoopBackOff|ImagePullBackOff|ErrImagePull|CreateContainerConfigError|CreateContainerError"}) == 1
              or max by (namespace, pod) (kube_pod_status_phase{phase="Pending"}) == 1
            for: 10m
            labels: { severity: warning }
            annotations:
              summary: "{{ $labels.pod }} has not started for 10 minutes."
              description: "oc describe pod {{ $labels.pod }} says why (image, setting, or not enough room)."

          - alert: PodRestarting
            expr: increase(kube_pod_container_status_restarts_total[30m]) > 2
            for: 5m
            labels: { severity: warning }
            annotations:
              summary: "{{ $labels.pod }} restarted more than twice in 30 minutes."
              description: "oc logs --previous {{ $labels.pod }} shows why it stopped."

          # last_terminated_reason stays 1 until the next termination: joined with a recent restart, so the
          # alert clears 10 minutes after an OOM instead of firing for ever.
          - alert: PodOOMKilled
            expr: >
              (kube_pod_container_status_last_terminated_reason{reason="OOMKilled"} == 1)
              and on (namespace, pod, container) increase(kube_pod_container_status_restarts_total[10m]) > 0
            for: 1m
            labels: { severity: warning }
            annotations:
              summary: "{{ $labels.pod }} ran out of memory and was restarted."
              description: Raise its memory limit in deploy/, or find what used the memory (the "What is slow" row).

# Alertmanager: where alerts go (by email; fill in its CHANGE_ME_ values here and in observability/alertmanager/alertmanager.yml)
---
apiVersion: v1                                   # core API version
kind: ConfigMap                                  # Alertmanager's config, mounted at /etc/alertmanager
metadata:                                        # the object's name and place
  name: alertmanager-config                      # the name its Deployment mounts (deploy_common.yaml)
  namespace: ai-common                           # the monitoring's project
  labels: { part-of: tsg-monitoring }            # marks it as TSG's monitoring
data:                                            # one key per file
  alertmanager.yml: |                            # receivers and routing: a copy of observability/alertmanager/alertmanager.yml
    # Alertmanager, UAT and laptop. Runs with --web.external-url=<host>/alertmanager/.
    # Alerts are sent by email (D-05). Two senders are set up; the `receiver:` line under `route:` picks the one used:
    #   company-smtp  the company's mail relay
    #   gmail         smtp.gmail.com:587 (STARTTLS), signed in with a Google app password
    # Every CHANGE_ME_ value is a placeholder: put in the relay, the sender and the recipients here and in the copy in
    # deploy/configmap.yaml. Passwords never go here: each is a file from Secret tsg-monitoring (deploy/secrets.yaml),
    # mounted at /etc/alertmanager-secrets (deploy/deploy_common.yaml). The laptop has no such folder, so its
    # Alertmanager cannot sign in and sends nothing. Firing alerts also show in Grafana (home dashboard and Alerting)
    # and at /alertmanager.

    route:
      receiver: company-smtp # where alerts go: company-smtp or gmail
      group_by: [alertname]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h

    receivers:
      - name: company-smtp
        email_configs:
          - smarthost: CHANGE_ME_RELAY_HOST:587 # the relay's host:port; it must offer STARTTLS (require_tls)
            from: CHANGE_ME_SENDER@company.example
            to: CHANGE_ME_RECIPIENTS@company.example # several: comma-separated
            auth_username: CHANGE_ME_RELAY_USER
            auth_password_file: /etc/alertmanager-secrets/smtp-relay-password # SMTP_RELAY_PASSWORD
            send_resolved: true # also say when an alert has cleared
      - name: gmail
        email_configs:
          - smarthost: smtp.gmail.com:587 # STARTTLS (require_tls)
            from: CHANGE_ME_SENDER@gmail.com
            to: CHANGE_ME_RECIPIENTS@company.example # several: comma-separated
            auth_username: CHANGE_ME_SENDER@gmail.com # the same Gmail address
            auth_password_file: /etc/alertmanager-secrets/gmail-app-password # GMAIL_APP_PASSWORD
            send_resolved: true # also say when an alert has cleared

# Loki: log storage
---
apiVersion: v1                                   # core API version
kind: ConfigMap                                  # Loki's config, mounted at /etc/loki
metadata:                                        # the object's name and place
  name: loki-config                              # the name its Deployment mounts (deploy_common.yaml)
  namespace: ai-common                           # the monitoring's project
  labels: { part-of: tsg-monitoring }            # marks it as TSG's monitoring
data:                                            # one key per file
  loki.yaml: |                                   # storage and retention: a copy of observability/loki/loki.yaml
    # Loki, UAT and laptop: one process (all parts in one binary), files on local disk, logs kept 7 days (D-07).
    # Started with -config.expand-env=true: LOKI_DATA is the data folder (UAT: the /loki volume; laptop: set by
    # scripts/monitoring.py). No public address in UAT (D31: oc port-forward); read it through Grafana, whose
    # anonymous Viewer can query it (POST /grafana/api/ds/query).
    # ponytail: one pod; split into Loki's separate parts only when log volume, not queries, is the problem.

    auth_enabled: false

    analytics:
      reporting_enabled: false # no usage reports to grafana.com

    server:
      http_listen_port: 3100
      grpc_listen_port: 9095
      # A burst of log lines can exceed the 4 MB default; the push would then fail and lines would be lost.
      grpc_server_max_recv_msg_size: 8388608
      grpc_server_max_send_msg_size: 8388608

    common:
      instance_addr: 127.0.0.1
      path_prefix: ${LOKI_DATA:-/loki}
      storage:
        filesystem:
          chunks_directory: ${LOKI_DATA:-/loki}/chunks
          rules_directory: ${LOKI_DATA:-/loki}/rules
      replication_factor: 1 # one pod: the default 3 would fail every write
      ring:
        kvstore:
          store: inmemory

    schema_config:
      configs:
        - from: 2024-01-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h

    limits_config:
      retention_period: 168h
      # Ids (request_id, session_id …) stay in the line text, never in labels or metadata: every new id would
      # make a new stream and the index would grow without end. They are still searchable: {app="tsg"} |= "<id>".
      allow_structured_metadata: false
      # After a restart Alloy may send a backlog older than the default 1 h window; rejected lines are lost.
      reject_old_samples: true
      reject_old_samples_max_age: 168h
      volume_enabled: true
      # Anyone who can query it (Grafana has no login) must not delete logs. Retention still deletes old logs.
      deletion_mode: disabled

    compactor:
      working_directory: ${LOKI_DATA:-/loki}/compactor
      retention_enabled: true # without it retention_period deletes nothing and the disk fills
      delete_request_store: filesystem

# Alloy: ships every pod's log lines to Loki
---
apiVersion: v1                                   # core API version
kind: ConfigMap                                  # Alloy's config, mounted at /etc/alloy
metadata:                                        # the object's name and place
  name: alloy-config                             # the name its Deployment mounts (deploy_common.yaml)
  namespace: ai-common                           # the monitoring's project
  labels: { part-of: tsg-monitoring }            # marks it as TSG's monitoring
data:                                            # one key per file
  config.alloy: |                                # which pods' logs to read: a copy of observability/alloy/uat.alloy
    // Alloy in UAT / production: ships the stdout of TSG's pods (pod label part-of: tsg or tsg-monitoring) in the
    // app's project (ai-threatgen) and in ai-common (the monitoring, Flower, worker-reaper) to Loki, through the
    // Kubernetes API (no host folders). ai-common is shared with a chatbot: its pods' logs are left out. The laptop
    // uses local.alloy: same labels, read from log files instead.

    logging {
      level  = "info"
      format = "logfmt"
    }

    discovery.kubernetes "pods" {
      role = "pod"
      namespaces {
        names = ["ai-threatgen", "ai-common"] // a namespaced Role in each allows nothing more
      }
    }

    // The only labels: each has a small, fixed set of values. app = the pod label part-of ("tsg" on every
    // app pod), component = the pod label component (api, worker, beat, flower …).
    discovery.relabel "pod_logs" {
      targets = discovery.kubernetes.pods.targets
      // TSG's pods only: the chatbot's pods in ai-common are never read.
      rule {
        source_labels = ["__meta_kubernetes_pod_label_part_of"]
        regex         = "tsg|tsg-monitoring"
        action        = "keep"
      }
      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label  = "container"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_label_part_of"]
        target_label  = "app"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_label_component"]
        target_label  = "component"
      }
    }

    loki.source.kubernetes "pods" {
      targets    = discovery.relabel.pod_logs.output
      forward_to = [loki.process.structlog.receiver]
    }

    // One JSON object per line (app/core/logging.py). `level` becomes a label; ids never do (see loki.yaml):
    // they stay in the line and are found with {app="tsg"} |= "<id>".
    loki.process "structlog" {
      forward_to = [loki.write.default.receiver]
      stage.json {
        expressions = { level = "level" }
      }
      stage.labels {
        values = { level = "level" }
      }
    }

    loki.write "default" {
      endpoint {
        url = "http://loki:3100/loki/api/v1/push"
      }
    }

# Grafana: data sources and where its dashboards are
---
apiVersion: v1                                   # core API version
kind: ConfigMap                                  # Grafana's start-up files, mounted under /etc/grafana/provisioning
metadata:                                        # the object's name and place
  name: grafana-provisioning                     # the name its Deployment mounts (deploy_common.yaml)
  namespace: ai-common                           # the monitoring's project
  labels: { part-of: tsg-monitoring }            # marks it as TSG's monitoring
data:                                            # one key per file
  datasources.yaml: |                            # Prometheus, Loki and Alertmanager as data sources: a copy of observability/grafana/provisioning/datasources/datasources.yaml
    # Grafana data sources, UAT and laptop. The addresses come from the environment (Grafana fills ${…} here):
    #   UAT:    http://prometheus:9090/prometheus   http://loki:3100   http://alertmanager:9093/alertmanager
    #   laptop: the same paths on http://localhost (scripts/monitoring.py sets them)
    # The uids are fixed: the dashboard (grafana/dashboards/tsg.json) refers to them.

    apiVersion: 1

    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: ${PROMETHEUS_URL}
        isDefault: true
        jsonData:
          timeInterval: 30s

      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: ${LOKI_URL}

      # Grafana's Alerting page lists and silences Alertmanager's alerts with this.
      - name: Alertmanager
        uid: alertmanager
        type: alertmanager
        access: proxy
        url: ${ALERTMANAGER_URL}
        jsonData:
          implementation: prometheus
          handleGrafanaManagedAlerts: false
  dashboards.yaml: |                             # the folder Grafana loads dashboards from: a copy of observability/grafana/provisioning/dashboards/dashboards.yaml
    # Loads the dashboards in GRAFANA_DASHBOARDS (UAT: /var/lib/grafana/dashboards; laptop: this repo's
    # observability/grafana/dashboards). They are files: edit the JSON in git, not in the Grafana screen.

    apiVersion: 1

    providers:
      - name: tsg
        folder: TSG
        type: file
        allowUiUpdates: false
        updateIntervalSeconds: 30
        options:
          path: ${GRAFANA_DASHBOARDS}

# The monitoring proxy: Grafana and Flower on the API's address (this one is in ai-threatgen)
---
apiVersion: v1                                   # core API version
kind: ConfigMap                                  # nginx's config, mounted at /etc/nginx/tsg
metadata:                                        # the object's name and place
  name: monitoring-proxy                         # the name its Deployment mounts (deploy_common.yaml)
  namespace: ai-threatgen                        # the proxy's project: only it may use the API's address
  labels: { part-of: tsg-monitoring }            # marks it as TSG's monitoring
data:                                            # one key per file
  nginx.conf: |                                  # where /grafana and /flower go: a copy of observability/nginx/nginx.conf
    # The monitoring proxy in UAT (deploy/deploy_common.yaml, project ai-threatgen); the laptop needs no proxy.
    # OpenShift gives a web address to one project only, so the Routes for /grafana and /flower on the API's address
    # are in ai-threatgen and point here. nginx forwards them, path unchanged, to TSG's Grafana and Flower in ai-common.
    # It runs as any user: everything it writes is under /tmp, and its errors go to the pod log.
    # It looks each address up once, at start: after a Service in ai-common is created again, restart this pod.

    worker_processes 1;
    daemon off;
    pid /tmp/nginx.pid;
    error_log stderr warn;

    events {
        worker_connections 512;
    }

    http {
        access_log off;
        server_tokens off;
        client_body_temp_path /tmp/client_body;
        proxy_temp_path /tmp/proxy;
        fastcgi_temp_path /tmp/fastcgi;
        uwsgi_temp_path /tmp/uwsgi;
        scgi_temp_path /tmp/scgi;
        # Request bodies up to 64k (Grafana's queries) stay in memory and answers pass straight on, never through a
        # temp file (each spill is a warn line in Loki); a connection a network rule blocks fails in 5 s with an error
        # line, not silently at the router's 30 s timeout.
        client_body_buffer_size 64k;
        proxy_max_temp_file_size 0;
        proxy_connect_timeout 5s;

        # Grafana Live keeps a websocket open: pass the upgrade on, and close plain requests as usual.
        map $http_upgrade $connection_upgrade {
            default upgrade;
            "" close;
        }

        server {
            listen 8080;

            proxy_http_version 1.1;
            proxy_set_header Host $host;  # Grafana refuses a change whose Origin is not its own address
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            location = /healthz {
                return 200 "ok\n";
            }

            # No path after the port: each program gets the path as it came (they serve under /grafana and /flower).
            location /grafana {
                proxy_pass http://grafana.ai-common.svc.cluster.local:3000;
            }

            location /flower {
                proxy_pass http://flower.ai-common.svc.cluster.local:5555;
            }

            location / {
                return 404;
            }
        }
    }

# Grafana: the TSG dashboard (about 6,000 lines of JSON; JSON allows no comments)
---
apiVersion: v1                                   # core API version
