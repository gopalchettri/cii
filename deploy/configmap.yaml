# configmap.yaml - tsg-config, the app's plain (non-secret) settings, the same in ai-threatgen and ai-common
# (UAT is production). The monitoring's config files are ConfigMaps made from observability/ (its
# kustomization.yaml): oc apply -k observability.
# Passwords, keys and connection strings are NOT here: they are in secrets.yaml.
# Apply:  oc apply -f deploy/configmap.yaml
# A running pod never sees a changed setting: after a change, restart TSG's pods in each project (the -l leaves
# every other Deployment alone: v1's in ai-threatgen, the chatbot's in ai-common):
#   oc -n ai-threatgen rollout restart deployment -l part-of=tsg
#   oc -n ai-threatgen rollout status deployment -l part-of=tsg --timeout=10m
#   oc -n ai-common rollout restart deployment -l part-of=tsg-monitoring
#   oc -n ai-common rollout status deployment -l part-of=tsg-monitoring --timeout=10m
#   oc -n ai-common rollout restart deployment/worker-reaper
#   oc -n ai-common rollout status deployment/worker-reaper --timeout=10m
#   oc -n ai-threatgen rollout restart deployment/monitoring-proxy
#   oc -n ai-threatgen rollout status deployment/monitoring-proxy --timeout=10m
# Step by step: deploy/DEPLOYMENT_GUIDE.md

# ---------------------------------------------------------------- 1. the app's settings (tsg-config)
apiVersion: v1                                   # core API version
kind: List                                       # several objects in one document, so the settings are written once
items:                                           # one tsg-config per project that runs TSG pods
  - apiVersion: v1                               # core API version
    kind: ConfigMap                              # plain, non-secret settings
    metadata:                                    # the object's name and place
      name: tsg-config                           # the name every TSG pod reads its settings from (envFrom)
      namespace: ai-threatgen                    # the API, beat and every worker but the reaper's run here
      labels: { part-of: tsg }                   # marks it as TSG's
    data: &settings                              # "&settings" names this block: ai-common's copy below reuses it unchanged
      CII_ENV: "uat"                             # environment name; anything but "dev" gets production's safety checks
      CII_CORS_ORIGINS: "https://threatgen-api.apps.dda-desc-az1-01.desccii.local"   # the platform UI's https address(es), comma-separated; "*" (any) is accepted in UAT, stops start-up in prod
      CII_MONGO_DB: "cii_uat"                    # MongoDB database that holds every run, scenario, plan and job
      CII_REDIS_CA_FILE: ""                      # the CA file that signed Redis' TLS certificate, if a private CA did (mount it); "" = the image's trusted CAs
      # Each module's own chat model (.env.example explains every line; its key is in tsg-secrets). Its limits are
      # its own: kimi-k2.5 (600 requests a minute on this key) serves threat scenarios alone;
      # glm-5.3 serves remediation and the service mapper (55-99 s a call). The gateway's 2,000,000 tokens a
      # minute cover every model together (owner, Nov 2026). A line left out = its default.
      CII_SCENARIO_CHAT_BASE_URL: "https://llmapi.govai.ae"           # threat finding and scenario writing: the AI gateway its chat calls go to
      CII_SCENARIO_CHAT_MODEL: "litellm_proxy/kimi-k2.5"              # its main chat model
      CII_SCENARIO_CHAT_MODEL_THINKING: "false"                       # false = the model's "thinking" mode off (faster)
      CII_SCENARIO_CHAT_MAX_INPUT_TOKENS: "114688"                    # kimi-k2.5: longest question in tokens (the gateway's limit)
      CII_SCENARIO_CHAT_MAX_OUTPUT_TOKENS: "12288"                    # kimi-k2.5: longest answer in tokens
      CII_SCENARIO_CHAT_TIMEOUT_SECONDS: "120"                        # kimi-k2.5: seconds to wait for one answer before giving up
      CII_SCENARIO_CHAT_REQUESTS_PER_MINUTE: "180"                    # kimi-k2.5 requests a minute, all pods: its own limit is 600 (Nov 2026); 180 covers up to about 20 users (about 8 a Start), up to about 570 for more
      CII_SCENARIO_CHAT_TOKENS_PER_MINUTE: "1000000"                  # kimi-k2.5 tokens a minute (question + answer room), all pods: calls take turns instead of drawing 429s; the gateway's 2,000,000 since Nov 2026 covers every model (shared with the team), and a 30 s burst may book 1.5x: 1.5 x the scenario tokens a minute + about 21,000 x plans at once + 10,000 x mappings at once at most 2,000,000; 0 = no limit
      CII_SCENARIO_MAX_CONCURRENT_AI_CALLS: "20"                      # its questions at the same time, all pods: 5 users x 4 threat questions (4 x users); it also backs off after a 429
      CII_REMEDIATION_CHAT_BASE_URL: "https://llmapi.govai.ae"        # remediation plans: the AI gateway its chat calls go to
      CII_REMEDIATION_CHAT_MODEL: "litellm_proxy/glm-5.3"             # its main chat model
      CII_REMEDIATION_CHAT_MODEL_THINKING: "false"                    # false = the model's "thinking" mode off (faster)
      CII_REMEDIATION_CHAT_MAX_INPUT_TOKENS: "262144"                 # glm-5.3: longest question in tokens (the gateway's limit)
      CII_REMEDIATION_CHAT_MAX_OUTPUT_TOKENS: "12288"                 # glm-5.3: longest answer in tokens
      CII_REMEDIATION_CHAT_TIMEOUT_SECONDS: "180"                     # glm-5.3: seconds to wait for one answer before giving up
      CII_REMEDIATION_CHAT_REQUESTS_PER_MINUTE: "0"                   # glm-5.3 requests a minute, all pods; 0 = no limit: glm-5.3 has none of its own (Nov 2026)
      CII_REMEDIATION_MAX_CONCURRENT_AI_CALLS: "5"                    # its calls at once to glm-5.3, all pods: 5 users' plans at once (about one per user; each books about 10,300 tokens while it runs)
      CII_SERVICE_MAPPER_CHAT_BASE_URL: "https://llmapi.govai.ae"     # the service mapper: the AI gateway its chat calls go to
      CII_SERVICE_MAPPER_CHAT_MODEL: "litellm_proxy/glm-5.3"          # its main chat model
      CII_SERVICE_MAPPER_CHAT_MODEL_THINKING: "false"                 # false = the model's "thinking" mode off (faster)
      CII_SERVICE_MAPPER_CHAT_MAX_INPUT_TOKENS: "262144"              # glm-5.3: longest question in tokens (the gateway's limit)
      CII_SERVICE_MAPPER_CHAT_MAX_OUTPUT_TOKENS: "12288"              # glm-5.3: longest answer in tokens
      CII_SERVICE_MAPPER_CHAT_TIMEOUT_SECONDS: "180"                  # glm-5.3: seconds to wait for one answer before giving up
      CII_SERVICE_MAPPER_CHAT_REQUESTS_PER_MINUTE: "0"                # glm-5.3 requests a minute, all pods; 0 = no limit: glm-5.3 has none of its own (Nov 2026)
      CII_SERVICE_MAPPER_MAX_CONCURRENT_AI_CALLS: "5"                 # its calls at once to glm-5.3, all pods: 5 users' mappings at once (about one per user; each books about 4,900 tokens)
      # Answer room per task, in tokens: the AI service counts it against its budget while a question runs; an
      # answer that needs more is asked once more with the model's full room.
      CII_ANSWER_TOKENS_RELEVANCE_GATE: "8192"                        # threat finding: is each threat relevant, as which kinds (one answer for up to 20 threats: 2,000-6,000 measured)
      CII_ANSWER_TOKENS_GAP_FILL: "1024"                              # threat finding: a threat for a STRIDE kind that found none
      CII_ANSWER_TOKENS_WRITE_SCENARIO: "6144"                        # scenario writing: one set of scenarios in one answer (at most about 780 a scenario)
      CII_ANSWER_TOKENS_REPAIR_SCENARIO: "5632"                       # scenario writing: a set's scenarios written again after a check, in one answer
      CII_ANSWER_TOKENS_REMEDIATION_PLAN: "3584"                      # remediation: one treatment plan (at most about 260 a control)
      CII_ANSWER_TOKENS_SERVICE_MAPPER: "3072"                        # service mapper: one mapping (10 + 10 services: at most about 2,000)
      CII_ANSWER_TOKENS_LINK_CONTROLS: "2048"                         # control links: which library controls do what one MITRE ATT&CK mitigation says (one answer per mitigation, at most 15 candidates)
      CII_ANSWER_TOKENS_PICK_CONTROLS: "3072"                         # POST /v1/create_session: the controls picked for one written set of scenarios, in one answer
      CII_ANSWER_TOKENS_MITRE_ACTOR_SELECTION: "8192"                   # MITRE run: the actors relevant to the asset, from one slice of MITRE actor profiles
      CII_ANSWER_TOKENS_MITRE_PLAN: "8192"                              # MITRE run: every attack path of one planner scope, in one answer
      CII_ANSWER_TOKENS_MITRE_DUPLICATE_CHECK: "2048"                   # MITRE run: which new planned paths repeat a planned one in meaning
      CII_ANSWER_TOKENS_MITRE_WRITE: "8000"                             # MITRE run: one set's scenarios, one per attack path (about 900 tokens each)
      CII_THREAT_QUESTIONS_AT_ONCE: "16"                              # threat finding: questions sent at the same time, per run: 16 x 20 = 320 threats in one round; never above the module cap
      CII_THREATS_PER_QUESTION: "20"                                  # threat finding: most whole threats in one question, split evenly (75 threats: 4 questions of 18-19, about half the time of 40)
      CII_SCENARIOS_WRITTEN_AT_ONCE: "6"                              # scenario writing: most scenarios in one write call (3 if a write of 6 times out)
      CII_THREAT_FINDING_REUSE_HOURS: "24"                            # threat finding: hours a run takes an earlier run's answer to the very same question (a second Start on an unchanged asset: no gate call); "0" = always ask
      CII_RERANKS_AT_ONCE: "4"                                        # search: evidence reranker calls at the same time, per worker (control searches do not take it): half of CII_MAX_CONCURRENT_AI_CALLS 8 (UAT's reranker: best at 8 at once, 12 dropped a connection, no 429, 16 Nov 2026)
      CII_AI_CALL_TOKENS_LIMIT: "20000"                               # most tokens one AI call may hold (question estimate + answer room); a bigger batch goes as halves
      CII_AI_BUSY_MAX_WAIT_SECONDS: "20"                              # after "too busy" (HTTP 429): longest wait (+-20%) before asking the same model again; LiteLLM always asks 60 s, but unused answer room comes back within seconds
      CII_AI_BUSY_TOTAL_WAIT_SECONDS: "60"                            # after "too busy": most seconds waited in all (4 retries at most), then the job tries again later
      CII_AI_BUSY_LIMIT_FLOOR: "4"                                    # after "too busy": the fewest questions still allowed at the same time
      CII_AI_BUSY_LIMIT_SECONDS: "60"                                 # seconds that slow-down lasts after the last "too busy"; a whole number. 60 = one gateway window, so the calls that filled the gateway can finish first (the code's default is 180)
      CII_EMBEDDING_BASE_URL: "https://llmapi.govai.ae"            # the AI gateway for embeddings (text to vectors)
      CII_EMBEDDING_MODEL: "litellm_proxy/qwen3-embedding-8b"      # embedding model for the library searches
      CII_RERANK_BASE_URL: "https://llmapi.govai.ae"               # the AI gateway for re-ranking search results
      CII_RERANK_MODEL: "litellm_proxy/qwen3-reranker-8b"          # re-ranking model
      CII_AI_KEY_HEADER: "x-litellm-api-key"     # header the gateway reads the AI key from
      CII_AI_BYPASS_PROXY: "true"                # must stay true: AI calls go to the gateway directly, not via the proxy
      CII_WORKER_METRICS_PORT: "9100"            # port each worker serves /metrics on for Prometheus
      CII_MAX_REQUEST_MB: "2"                    # largest request body the API accepts, in MB
      CII_MAX_CONCURRENT_AI_CALLS: "8"           # the search calls (embedding, re-ranking) at once across all pods: UAT's reranker works best at 8 at once and drops connections above about 10, and it answers no 429 (the owner's probe, 16 Nov 2026), so 0 (no fixed limit, backing off only after a 429) would not protect it. A 429 still lowers the limit for a while (halved, raised again by each answer, gone a few minutes after the last 429). Each module's chat calls: its own limit above
      CII_EMBEDDING_REQUESTS_PER_MINUTE: "0"         # embedding requests a minute, all pods; 0 = no limit: the gateway sets no per-minute limit (calls at once: CII_MAX_CONCURRENT_AI_CALLS, lowered for a while by a 429; it takes 30)
      CII_RERANK_REQUESTS_PER_MINUTE: "0"            # the same for the re-ranking model; 0 = no limit: the gateway sets no per-minute limit (calls at once: CII_MAX_CONCURRENT_AI_CALLS; best at 8, 10 worked, 12 dropped a connection with no 429, 16 Nov 2026)
      CII_LOG_LEVEL: "INFO"                      # log detail: DEBUG, INFO, WARNING or ERROR (DEBUG only for a short check)
      TOTAL_SCENARIO_COUNT: "15"                 # most scenarios a run produces
      INITIAL_SET_SIZE: "6"                      # scenarios written first, so a reviewer can start reading
      NEXT_SET_SIZE: "6"                         # scenarios written by each "next set" call
      REGENERATIONS_MAX_VERSION_COUNT: "10"      # versions kept per remediation plan (first plan + 9 regenerations)
      SERVICE_MAPPER_UPSTREAM_TOTAL_COUNT: "10"      # upstream services the service mapper asks the AI for (0 = off)
      SERVICE_MAPPER_DOWNSTREAM_TOTAL_COUNT: "10"    # downstream services the service mapper asks the AI for (0 = off)
      SERVICE_MAPPER_MAX_GENERATIONS: "5"            # runs per mapping, the first included (Generate, then Generate again or Regenerate); 0 = no limit
      ASSET_PROPERTIES_REQUIRED: ""              # asset facts a run must have, comma-separated (empty = none)
      SYSTEM_PROPERTIES_REQUIRED: ""             # supporting-system facts a run must have (empty = none)
      CONTROL_SIMILARITY_THRESHOLD: "50"         # how close a library control must be to a scenario to be kept
      CONTROL_CANDIDATES: "40"                   # library controls searched per scenario (required: no default)
      MIN_CONTROLS: "3"                          # fewest controls kept per scenario
      MAX_CONTROLS: "10"                         # most controls kept per scenario (the same as the UAT server)
      NEAREST_CONTROLS: "3"                      # controls kept when none is close enough
      THREAT_SCENARIO_WORD_LIMIT: "120-180"      # words asked for per scenario statement (min-max; the code's default is 150-200)
      RISK_STATEMENT_WORD_LIMIT: "80-120"        # words asked for per risk statement (min-max; the code's default is 100-150)
      EVIDENCE_STATEMENT_WORD_LIMIT: "20-60"     # words asked for per evidence passage (min-max)
      THREAT_SIMILARITY_THRESHOLD: "60"          # how close an AI-proposed threat must be to count as a library threat
      EXTERNAL_INTELLIGENCE_ENABLED: "true"      # use the MITRE ATT&CK feeds as evidence
      EVIDENCE_SIMILARITY_THRESHOLD: "50"        # reranker score evidence must reach (required while the feeds are on)
      EVIDENCE_CANDIDATES: "30"                  # intelligence records scored per threat
      EVIDENCE_KEPT_PER_THREAT: "3"              # intelligence records kept per threat
      THREAT_CONTEXT_COUNTRY: "United Arab Emirates"   # the country the assets are in (read as a fact)
      ACTOR_PROFILE_DESCRIPTION_CHARACTERS: "1200"                      # actor selection: each MITRE actor's description cut to this (all 240 at 1200 = about 27.6k tokens) (required: no default)
      MITRE_MINIMUM_QUOTE_WORDS: "5"                                    # actor selection: an evidence quote must be at least this many words of the actor's MITRE text (required: no default)
      PLANNER_RELEVANT_ACTORS: "15"                                     # planning: the most relevant selected actors (with their techniques) the planner sees (required: no default)
      ATTACK_PATH_TECHNIQUES: "3-6"                                     # planning: techniques per attack path, min-max (a longer plan is dropped) (required: no default)
      MITRE_PLANNER_SINGLE_CALL_LIMIT: "40"                             # planning: a run of at most this many paths is planned in one call, else one call per STRIDE category (required: no default)
      MITRE_PLANNER_MAX_FURTHER_ROUNDS: "1"                             # planning: TOTAL_SCENARIO_COUNT=0: the most "any others?" planner rounds a run asks; a cost guard, never a target (required: no default)
      MITRE_DUPLICATE_TECHNIQUE_OVERLAP: "0.7"                          # planning: two paths sharing this share of techniques are duplicates, in any STRIDE category (required: no default)
      CATALOGUE_SUMMARY_SENTENCES: "1"                                  # planning: sentences of each ICS technique's summary in the catalogue (required: no default)
      CATALOGUE_SUMMARY_CHARACTERS: "70"                                # planning: each catalogue summary cut to this many characters (required: no default)
      ICS_ASSET_DESCRIPTION_CHARACTERS: "150"                           # planning: each MITRE ICS asset type's description cut to this (required: no default)
      CANDIDATE_GROUPS_PER_SCENARIO: "6"                                # writing: candidate MITRE groups sent per path (required: no default)
      MITRE_MINIMUM_CANDIDATES_AFTER_TRIM: "3"                          # writing: a writer input cut to its call limit keeps at least this many candidate groups (required: no default)
      MITRE_GROUPS_PER_SCENARIO: "3"                                    # writing: most relevant groups one scenario names (required: no default)
      MAX_SCENARIO_SHARE_PER_GROUP: "0.5"                               # writing: most share (0-1) of a run's scenarios one group may appear in (required: no default)
      PROCEDURES_PER_TECHNIQUE: "3"                                     # writing: MITRE procedures sent per technique (required: no default)
      PROCEDURE_TEXT_CHARACTERS: "300"                                  # writing: each procedure text cut to this (required: no default)
      SOFTWARE_DESCRIPTION_CHARACTERS: "300"                            # writing: each software description cut to this (required: no default)
      WRITER_CANDIDATE_DESCRIPTION_CHARACTERS: "300"                    # writing: each candidate group's description cut to this (required: no default)
      WRITER_TECHNIQUE_DESCRIPTION_CHARACTERS: "400"                    # writing: each technique description cut to its opening sentences within this (required: no default)
      MITRE_THREAT_SCENARIO_WORD_LIMIT: "100-150"                       # writing: words per threat scenario, min-max (required: no default)
      MITRE_RISK_STATEMENT_WORD_LIMIT: "30-40"                          # writing: words per risk statement, min-max (required: no default)
      MITRE_RISK_TITLE_WORD_LIMIT: "4-10"                               # writing: words per risk title, min-max (required: no default)
      MITRE_SCENARIO_TITLE_WORD_LIMIT: "3-8"                            # writing: words per scenario title, min-max (required: no default)
      MITRE_WORDS_PER_SENTENCE: "15"                                    # writing: the scenario's sentence count is aimed at its words / this (required: no default)
      MITRE_RELEVANCE_RANGE: "2-5"                                      # actor selection: the relevance an actor row must have, min-max (the prompt's 1-5 scale) (required: no default)
      MITRE_EXTRA_PATHS_PER_SCOPE: "2"                                  # planning: paths asked for beyond the run's need in each STRIDE scope's call (required: no default)
      MITRE_EXTRA_PATHS_IN_ONE_CALL: "5"                                # planning: paths asked for beyond the run's need when planned in one call (required: no default)
      MITRE_CROSSING_REASON_CHARACTERS: "300"                           # planning: the planner's IT/OT crossing reason for an all-OT asset cut to this (required: no default)
      MITRE_MINIMUM_SCENARIO_SENTENCES: "3"                             # writing: the fewest short sentences the threat scenario is asked for (required: no default)
      MITRE_WORD_LIMIT_SLACK: "0.25"                                    # writing: the share a word maximum may be exceeded by before the writer is re-asked (required: no default)
      MITRE_PARALLEL_WRITERS: "5"                                       # writing: writer calls of one MITRE set run at once (required: no default)
      MITRE_PLAN_CALL_TOKENS_LIMIT: "60000"                             # most tokens (prompt chars/3 + answer room) one planner call holds: the POC's 34,000 input tokens x 1.5 + the 8,192 planner room (required: no default)
      MITRE_ACTOR_SLICE_TOKENS_LIMIT: "34000"                           # most tokens (prompt chars/3 + answer room) one actor-selection slice holds: two slices asked in parallel, each answer within its 8,192 room (required: no default)
      MITRE_WRITE_CALL_TOKENS_LIMIT: "60000"                            # most tokens (prompt chars/3 + answer room) one writer call holds: a set's paths are written together up to it (required: no default)
      MITRE_CONTROLS_BY_TECHNIQUE: "true"                              # a MITRE card's controls chosen per technique among its MITRE-linked library controls (false: per sentence) (required: no default)
      CONTROLS_PER_TECHNIQUE_CANDIDATES: "6"                           # MITRE-linked controls offered per technique, best link first (required: no default)
      CONTROLS_PER_TECHNIQUE: "2"                                      # controls the AI keeps per technique (required: no default)
      MITIGATION_TEXT_CHARACTERS: "300"                                # MITRE's words on how a mitigation defends a technique, cut to this (required: no default)
  - apiVersion: v1                               # core API version
    kind: ConfigMap                              # plain, non-secret settings
    metadata:                                    # the object's name and place
      name: tsg-config                           # the same name, read the same way
      namespace: ai-common                       # worker-reaper and Flower run here (Flower loads the settings to start)
      labels: { part-of: tsg }                   # marks it as TSG's
    data: *settings                              # "*settings" = exactly the settings written above
