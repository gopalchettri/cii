        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "text",
          "title": "How to use this page",
          "description": "Read me first.",
          "options": {
            "mode": "markdown",
            "content": "**Green = working. Red = look now.** Times follow the picker at the top right. Nothing to type: click.\n\n| You are | Start here |\n|---|---|\n| **Operations** | The tiles under *Is everything working?* Any red tile or line in *What is wrong right now* says what to do (click it). |\n| **Support** | A user quotes a **request id** (from an error message) or a **run id**: paste it in *Find a run, request or job id* at the top, then open *Follow one run or request*. Or click any blue id on this page. |\n| **Developers** | *Errors and exceptions* lists every bug with its traceback (click a row, then the request or run id for the whole story). *What is slow* shows where time goes. |"
          },
