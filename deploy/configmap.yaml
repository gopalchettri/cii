# Grafana: the AI usage dashboard. Its own ConfigMap: oc apply keeps each object in one annotation of at most
# 256 KiB, and tsg.json alone takes about 220 KB of it.
---
apiVersion: v1                                   # core API version
kind: ConfigMap                                  # the AI usage dashboard, mounted beside tsg.json at /var/lib/grafana/dashboards
metadata:                                        # the object's name and place
  name: grafana-dashboard-ai-usage               # the name its Deployment mounts (deploy_common.yaml)
  namespace: ai-common                           # the monitoring's project
  labels: { part-of: tsg-monitoring }            # marks it as TSG's monitoring
data:                                            # one key per file
  ai_usage.json: |                               # the AI usage dashboard: a copy of observability/grafana/dashboards/ai_usage.json
    {
      "uid": "tsg-ai-usage",
      "title": "TSG — AI usage",
      "description": "How many AI calls TSG made, for which module and API call, in which part of the work, on which model, and how many failed: counts only. Exact numbers per session and request: GET /v1/ai-usage (no key).",
      "tags": [
        "tsg",
        "ai-usage"
      ],
      "timezone": "browser",
      "editable": false,
      "graphTooltip": 1,
      "refresh": "1m",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "schemaVersion": 41,
      "version": 1,
      "links": [
        {
          "title": "Home: is everything working?",
          "type": "link",
          "icon": "dashboard",
          "url": "/grafana/d/tsg/tsg",
          "keepTime": true,
          "tooltip": "The TSG home page"
        },
        {
          "title": "All alerts, with what to do",
          "type": "link",
          "icon": "bell",
          "url": "/grafana/alerting/groups?alertmanager=Alertmanager",
          "tooltip": "Each firing alert's full message and what to do; silence one here"
        }
      ],
      "templating": {
        "list": [
          {
            "name": "module",
            "label": "Module",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "query": {
              "qryType": 1,
              "query": "label_values(tsg_ai_usage_calls_total, module)",
              "refId": "PrometheusVariableQueryEditor-VariableQuery"
            },
            "definition": "label_values(tsg_ai_usage_calls_total, module)",
            "refresh": 2,
            "hide": 0,
            "includeAll": true,
            "multi": true,
            "allValue": ".*",
            "sort": 1,
            "regex": "",
            "options": [],
            "current": {
              "text": [
                "All"
              ],
              "value": [
                "$__all"
              ]
            },
            "description": "Narrow every count to these modules (All: every one). none = shared work no request asked for."
          },
          {
            "name": "api",
            "label": "API call",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "query": {
              "qryType": 1,
              "query": "label_values(tsg_ai_usage_calls_total{module=~\"$module\"}, api)",
              "refId": "PrometheusVariableQueryEditor-VariableQuery"
            },
            "definition": "label_values(tsg_ai_usage_calls_total{module=~\"$module\"}, api)",
            "refresh": 2,
            "hide": 0,
            "includeAll": true,
            "multi": true,
            "allValue": ".*",
            "sort": 1,
            "regex": "",
            "options": [],
            "current": {
              "text": [
                "All"
              ],
              "value": [
                "$__all"
              ]
            },
            "description": "Narrow to these API calls. regenerate exists in three modules: pick the module too."
          },
          {
            "name": "session",
            "label": "Session or request id",
            "type": "textbox",
            "query": "",
            "current": {
              "text": "",
              "value": ""
            },
            "hide": 0,
            "description": "Paste a session (run) id or a request id: the links in 'One session or request' open its reports."
          },
          {
            "name": "reports",
            "label": "AI usage reports address",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "query": {
              "qryType": 1,
              "query": "label_values(up{job=\"api\"}, ui_url)",
              "refId": "PrometheusVariableQueryEditor-VariableQuery"
            },
            "definition": "label_values(up{job=\"api\"}, ui_url)",
            "refresh": 1,
            "hide": 2,
            "includeAll": false,
            "multi": false,
            "sort": 0,
            "regex": "",
            "options": [],
            "current": {},
            "description": "Hidden. Where this environment's AI usage reports are, as its Prometheus names it (ui_url on the API target): http://localhost:8000/v1/ai-usage on the laptop, /v1/ai-usage in UAT (Grafana is on the API's host)."
          }
        ]
      },
      "panels": [
        {
          "id": 101,
          "type": "text",
          "title": "How to read this page",
          "description": "Read me first.",
          "options": {
            "mode": "markdown",
            "content": "**How many AI calls TSG made in the time chosen at the top right, and for what.** Counts only. *Module* and *API call* at the top narrow every panel but the by-model table and the tracking checks at the bottom (All = everything); hover the (i) by a title for what it counts.\n\n- **AI call**: one try sent to an AI model; a retried call counts each try.\n- **Earlier answer reused**: a job's retry read back an answer it had: no call.\n- **Part**: the step the call was for.\n\nExact numbers for one session or request: **One session or request**, at the bottom."
          },
          "gridPos": {
            "h": 3,
            "w": 24,
            "x": 0,
            "y": 0
          }
        },
        {
          "id": 102,
          "type": "row",
          "title": "In the chosen time",
          "collapsed": false,
          "panels": [],
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 3
          },
          "description": "The whole picture in eight numbers, for the modules and API calls chosen at the top."
        },
        {
          "id": 103,
          "type": "stat",
          "title": "API calls that started AI work",
          "description": "API calls that start AI work (Create scenario, Next set, Regenerate scenarios, Create remediation plan, Regenerate plan, Map services, Regenerate mapping) that answered 202: work started. A 200 (a repeat, or nothing new to do) or an error started none. Prometheus counts over the chosen time, from every pod's counters (a pod's first calls and a restarted pod's count too); the exact numbers, per request and per session, come from GET /v1/ai-usage (no key).",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(label_replace(\n  label_replace(label_replace(label_replace(label_replace(label_replace(label_replace(label_replace(\n    (((tsg_http_requests_total{method=\"POST\", status=\"202\"} - tsg_http_requests_total{method=\"POST\", status=\"202\"} offset $__range) and resets(tsg_http_requests_total{method=\"POST\", status=\"202\"}[$__range]) == 0) or (round(increase(tsg_http_requests_total{method=\"POST\", status=\"202\"}[$__range])) and last_over_time(tsg_http_requests_total{method=\"POST\", status=\"202\"}[1h] offset $__range)) or (max_over_time(tsg_http_requests_total{method=\"POST\", status=\"202\"}[$__range]) unless last_over_time(tsg_http_requests_total{method=\"POST\", status=\"202\"}[1h] offset $__range))),\n  \"call\", \"threat_scenarios/create_scenario\", \"route\", \"/v1/sessions\"),\n  \"call\", \"threat_scenarios/next_set\", \"route\", \"/v1/sessions/[^/]+/scenarios/next-set\"),\n  \"call\", \"threat_scenarios/regenerate\", \"route\", \"/v1/sessions/[^/]+/regenerate/scenarios\"),\n  \"call\", \"remediation/create_plan\", \"route\", \"/v1/remediation\"),\n  \"call\", \"remediation/regenerate\", \"route\", \"/v1/sessions/[^/]+/scenarios/[^/]+/treatment-plan/regenerate\"),\n  \"call\", \"service_mapper/create_mapping\", \"route\", \"/v1/service-mapper\"),\n  \"call\", \"service_mapper/regenerate\", \"route\", \"/v1/service-mapper/[^/]+/regenerate\"),\n\"picked\", \"1\", \"call\", \"($module)/($api)\")\nand on (picked) label_replace(vector(1), \"picked\", \"1\", \"\", \"\")) or vector(0)",
              "legendFormat": "API calls that started AI work",
              "instant": true,
              "range": false,
              "format": "time_series"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "noValue": "0",
              "color": {
                "mode": "fixed",
                "fixedColor": "text"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "value",
            "justifyMode": "center",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 0,
            "y": 4
          }
        },
        {
          "id": 104,
          "type": "stat",
          "title": "AI calls",
          "description": "Tries sent to an AI model (writing, embedding, ranking), retries included. Prometheus counts over the chosen time, from every pod's counters (a pod's first calls and a restarted pod's count too); the exact numbers, per request and per session, come from GET /v1/ai-usage (no key).",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum((((tsg_ai_usage_calls_total{module=~\"$module\", api=~\"$api\", outcome!=\"reused\"} - tsg_ai_usage_calls_total{module=~\"$module\", api=~\"$api\", outcome!=\"reused\"} offset $__range) and resets(tsg_ai_usage_calls_total{module=~\"$module\", api=~\"$api\", outcome!=\"reused\"}[$__range]) == 0) or (round(increase(tsg_ai_usage_calls_total{module=~\"$module\", api=~\"$api\", outcome!=\"reused\"}[$__range])) and last_over_time(tsg_ai_usage_calls_total{module=~\"$module\", api=~\"$api\", outcome!=\"reused\"}[1h] offset $__range)) or (max_over_time(tsg_ai_usage_calls_total{module=~\"$module\", api=~\"$api\", outcome!=\"reused\"}[$__range]) unless last_over_time(tsg_ai_usage_calls_total{module=~\"$module\", api=~\"$api\", outcome!=\"reused\"}[1h] offset $__range)))) or vector(0)",
              "legendFormat": "AI calls",
              "instant": true,
              "range": false,
              "format": "time_series"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "noValue": "0",
              "color": {
                "mode": "fixed",
                "fixedColor": "blue"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "value",
            "justifyMode": "center",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 6,
            "y": 4
          }
