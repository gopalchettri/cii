            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "query": {
              "qryType": 1,
              "query": "label_values(up{job=\"flower\"}, ui_url)",
              "refId": "PrometheusVariableQueryEditor-VariableQuery"
            },
            "definition": "label_values(up{job=\"flower\"}, ui_url)",
            "refresh": 1,
            "hide": 2,
            "includeAll": false,
            "multi": false,
            "sort": 0,
            "regex": "",
            "options": [],
            "current": {},
            "description": "Hidden. Flower's page in this environment, as this environment's Prometheus names it (ui_url on its Flower target): http://localhost:5555/flower/ on the laptop, /flower/ in UAT. The Flower link opens it."
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "text",
          "title": "How to use this page",
          "description": "Read me first.",
