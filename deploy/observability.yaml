# TSG v2 monitoring in UAT: plain OpenShift YAML for project ai-remediation (v1 kept its monitoring there too, so
# it does not use ai-threatgen's CPU budget). Apply with deploy/observability.ps1: it first builds the ConfigMaps
# from observability/ (the same files the laptop uses: Prometheus' config and alert rules, Alertmanager, Loki,
# Alloy, Grafana's data sources and dashboard) and the Secrets from .env.uat (Grafana's admin password and
# settings, the queue-depth database), then applies this file. Flower is deploy/flower.yaml (it runs from the app
# image; deploy/deploy-uat.ps1 applies it).
#
# What you get, all public and without login (owner, 2026-10-08), on the monitoring host:
#   https://threatgen-grafana.apps.dda-desc-az1-01.desccii.local/grafana/       Grafana: the one place to look
#   https://threatgen-grafana.apps.dda-desc-az1-01.desccii.local/flower/        Flower: background jobs (view only)
#   https://threatgen-grafana.apps.dda-desc-az1-01.desccii.local/prometheus/    Prometheus: raw metrics, alert rules
#   https://threatgen-grafana.apps.dda-desc-az1-01.desccii.local/alertmanager/  Alertmanager: firing alerts, silences
#   https://threatgen-grafana.apps.dda-desc-az1-01.desccii.local/loki/          Loki's API (read it through Grafana)
# The API's own /metrics, /health and /ready are on threatgen-api (deploy/deploy.yaml).
#
# Prometheus finds the app pods in BOTH projects (ai-threatgen and ai-remediation) by their annotations
# (observability/prometheus/prometheus.yml); Alloy ships both projects' pod logs; kube-state-metrics watches both.
# Each reads ai-threatgen through a Role there (below): namespaced objects only, no cluster-wide rights.
#
# STEP 0 — images. The cluster pulls only from the mirror (quay-quay-registry.apps.dda-desc-az1-01.desccii.local/
# dda-desc). Before the first apply, and after any version change below, copy each image there from a machine
# with internet access, e.g.:
#   podman pull --platform linux/amd64 docker.io/prom/prometheus:v3.15.0
#   podman tag  docker.io/prom/prometheus:v3.15.0 <mirror>/prometheus:v3.15.0
#   podman push <mirror>/prometheus:v3.15.0
# The version on each `image:` line is the one pin: scripts/monitoring.py installs the same versions on a laptop.

# ---------------------------------------------------------------- access (namespaced only)
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: ai-remediation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus-find-pods
  namespace: ai-remediation
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus-find-pods
  namespace: ai-remediation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prometheus-find-pods
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: ai-remediation

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alloy
  namespace: ai-remediation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: alloy-read-logs
  namespace: ai-remediation
rules:
  - apiGroups: [""]
    resources: [pods, pods/log]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: alloy-read-logs
  namespace: ai-remediation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: alloy-read-logs
subjects:
  - kind: ServiceAccount
    name: alloy
    namespace: ai-remediation

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-state-metrics
  namespace: ai-remediation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kube-state-metrics-read-pods
  namespace: ai-remediation
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kube-state-metrics-read-pods
  namespace: ai-remediation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kube-state-metrics-read-pods
subjects:
  - kind: ServiceAccount
    name: kube-state-metrics
    namespace: ai-remediation

# The app's own project: the same three may read its pods (and Alloy their logs), nothing else.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tsg-monitoring-read-pods
  namespace: ai-threatgen
rules:
  - apiGroups: [""]
    resources: [pods, pods/log]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tsg-monitoring-read-pods
  namespace: ai-threatgen
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tsg-monitoring-read-pods
subjects:
  - { kind: ServiceAccount, name: prometheus, namespace: ai-remediation }
  - { kind: ServiceAccount, name: alloy, namespace: ai-remediation }
  - { kind: ServiceAccount, name: kube-state-metrics, namespace: ai-remediation }

