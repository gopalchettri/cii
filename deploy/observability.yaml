# ---------------------------------------------------------------- Prometheus (15 days)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: ai-remediation
  labels: { app.kubernetes.io/name: prometheus, app.kubernetes.io/part-of: tsg-observability }
spec:
  replicas: 1
  strategy: { type: Recreate } # one writer on a ReadWriteOnce volume
  selector:
    matchLabels: { app.kubernetes.io/name: prometheus }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus
        app.kubernetes.io/component: prometheus
        app.kubernetes.io/part-of: tsg-observability
        tsg-observability: "true"
    spec:
      serviceAccountName: prometheus
      imagePullSecrets: [{ name: quay-pull }]
      containers:
        - name: prometheus
          image: quay-quay-registry.apps.dda-desc-az1-01.desccii.local/dda-desc/prometheus:v3.15.0
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities: { drop: [ALL] }
            seccompProfile: { type: RuntimeDefault }
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=15d
            - --storage.tsdb.retention.size=8GB
            - --web.external-url=https://threatgen-grafana.apps.dda-desc-az1-01.desccii.local/prometheus/
          ports: [{ name: http, containerPort: 9090 }]
          readinessProbe:
            httpGet: { path: /prometheus/-/ready, port: 9090 }
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet: { path: /prometheus/-/healthy, port: 9090 }
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - { name: config, mountPath: /etc/prometheus }
            - { name: data, mountPath: /prometheus }
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits: { cpu: 500m, memory: 1Gi }
      volumes:
        - name: config
          configMap: { name: prometheus-config }
        - name: data
          persistentVolumeClaim: { claimName: prometheus-data }
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: ai-remediation
spec:
  selector: { app.kubernetes.io/name: prometheus }
  ports: [{ name: http, port: 9090, targetPort: 9090 }]

# ---------------------------------------------------------------- Alertmanager (D-05: no channel yet)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: ai-remediation
  labels: { app.kubernetes.io/name: alertmanager, app.kubernetes.io/part-of: tsg-observability }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: alertmanager }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alertmanager
        app.kubernetes.io/component: alertmanager
        app.kubernetes.io/part-of: tsg-observability
        tsg-observability: "true"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9093"
        prometheus.io/path: /alertmanager/metrics
    spec:
      imagePullSecrets: [{ name: quay-pull }]
      containers:
        - name: alertmanager
          image: quay-quay-registry.apps.dda-desc-az1-01.desccii.local/dda-desc/alertmanager:v0.34.1
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities: { drop: [ALL] }
            seccompProfile: { type: RuntimeDefault }
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
            # ponytail: silences live on an emptyDir and are lost on restart; add a volume if that hurts.
            - --storage.path=/alertmanager
            - --web.external-url=https://threatgen-grafana.apps.dda-desc-az1-01.desccii.local/alertmanager/
            - --cluster.listen-address=  # one Alertmanager: no peers to find
          ports: [{ name: http, containerPort: 9093 }]
          readinessProbe:
            httpGet: { path: /alertmanager/-/ready, port: 9093 }
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /alertmanager/-/healthy, port: 9093 }
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - { name: config, mountPath: /etc/alertmanager }
            - { name: data, mountPath: /alertmanager }
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { cpu: 100m, memory: 256Mi }
      volumes:
        - name: config
          configMap: { name: alertmanager-config }
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: ai-remediation
spec:
  selector: { app.kubernetes.io/name: alertmanager }
  ports: [{ name: http, port: 9093, targetPort: 9093 }]

# ---------------------------------------------------------------- Loki (7 days)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: ai-remediation
  labels: { app.kubernetes.io/name: loki, app.kubernetes.io/part-of: tsg-observability }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: loki }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loki
        app.kubernetes.io/component: loki
        app.kubernetes.io/part-of: tsg-observability
        tsg-observability: "true"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3100"
        prometheus.io/path: /metrics
    spec:
      imagePullSecrets: [{ name: quay-pull }]
      containers:
        - name: loki
          image: quay-quay-registry.apps.dda-desc-az1-01.desccii.local/dda-desc/loki:3.7.8
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities: { drop: [ALL] }
            seccompProfile: { type: RuntimeDefault }
          imagePullPolicy: IfNotPresent
          args: [-config.file=/etc/loki/loki.yaml, -config.expand-env=true, -target=all]
          env:
            - { name: LOKI_DATA, value: /loki }
          ports:
            - { name: http, containerPort: 3100 }
            - { name: grpc, containerPort: 9095 }
          readinessProbe:
            httpGet: { path: /ready, port: 3100 }
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet: { path: /ready, port: 3100 }
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 10
          volumeMounts:
            - { name: config, mountPath: /etc/loki }
            - { name: data, mountPath: /loki }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 1Gi }
      volumes:
        - name: config
          configMap: { name: loki-config }
        - name: data
          persistentVolumeClaim: { claimName: loki-data }
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: ai-remediation
spec:
  selector: { app.kubernetes.io/name: loki }
  ports: [{ name: http, port: 3100, targetPort: 3100 }]

# ---------------------------------------------------------------- Alloy (pod logs -> Loki)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alloy
  namespace: ai-remediation
  labels: { app.kubernetes.io/name: alloy, app.kubernetes.io/part-of: tsg-observability }
spec:
  replicas: 1 # one reader: two would ship every line twice
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: alloy }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alloy
        app.kubernetes.io/component: alloy
        app.kubernetes.io/part-of: tsg-observability
        tsg-observability: "true"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "12345"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: alloy
      imagePullSecrets: [{ name: quay-pull }]
      containers:
        - name: alloy
          image: quay-quay-registry.apps.dda-desc-az1-01.desccii.local/dda-desc/alloy:v1.20.1
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities: { drop: [ALL] }
            seccompProfile: { type: RuntimeDefault }
          imagePullPolicy: IfNotPresent
          args:
            - run
            - /etc/alloy/config.alloy
            - --server.http.listen-addr=0.0.0.0:12345
            - --storage.path=/tmp/alloy
            - --disable-reporting
          ports: [{ name: http, containerPort: 12345 }]
          readinessProbe:
            httpGet: { path: /-/ready, port: 12345 }
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /-/ready, port: 12345 }
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - { name: config, mountPath: /etc/alloy }
            - { name: data, mountPath: /tmp/alloy }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 300m, memory: 512Mi }
      volumes:
        - name: config
          configMap: { name: alloy-config }
        - name: data
          emptyDir: {}

# ---------------------------------------------------------------- Grafana (the one place to look)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: ai-remediation
  labels: { app.kubernetes.io/name: grafana, app.kubernetes.io/part-of: tsg-observability }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: grafana }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/component: grafana
        app.kubernetes.io/part-of: tsg-observability
        tsg-observability: "true"
    spec:
      imagePullSecrets: [{ name: quay-pull }]
      initContainers:
        # Grafana reads GF_SECURITY_ADMIN_PASSWORD only when it creates its database, which lives on a
        # volume: without this, a new password in .env.uat would never take effect.
        - name: set-admin-password
          image: quay-quay-registry.apps.dda-desc-az1-01.desccii.local/dda-desc/grafana:12.4.12
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities: { drop: [ALL] }
            seccompProfile: { type: RuntimeDefault }
          command: [sh, -c]
          args:
            - >-
              if [ -f /var/lib/grafana/grafana.db ]; then
              printf '%s' "$GF_SECURITY_ADMIN_PASSWORD" | grafana cli --homepath /usr/share/grafana
              admin reset-admin-password --password-from-stdin; fi
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: tsg-monitoring, key: GF_SECURITY_ADMIN_PASSWORD } }
          volumeMounts:
            - { name: data, mountPath: /var/lib/grafana }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 200m, memory: 256Mi }
      containers:
        - name: grafana
          image: quay-quay-registry.apps.dda-desc-az1-01.desccii.local/dda-desc/grafana:12.4.12
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities: { drop: [ALL] }
            seccompProfile: { type: RuntimeDefault }
          imagePullPolicy: IfNotPresent
          # Grafana's own settings: every GF_ line of .env.uat (owner, 2026-10-09), which
          # deploy/observability.ps1 copies into this Secret. The env entries below win over these: the links,
          # the /grafana path and the home dashboard depend on them.
          envFrom:
            - secretRef: { name: tsg-grafana-settings }
          env:
            # The admin password only changes Grafana itself; looking needs no login.
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: tsg-monitoring, key: GF_SECURITY_ADMIN_PASSWORD } }
            - { name: GF_SERVER_ROOT_URL, value: "https://threatgen-grafana.apps.dda-desc-az1-01.desccii.local/grafana/" }
            - { name: GF_SERVER_SERVE_FROM_SUB_PATH, value: "true" }
            - { name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH, value: /var/lib/grafana/dashboards/tsg.json }
            - { name: GRAFANA_DASHBOARDS, value: /var/lib/grafana/dashboards }
            - { name: PROMETHEUS_URL, value: "http://prometheus:9090/prometheus" }
            - { name: LOKI_URL, value: "http://loki:3100" }
            - { name: ALERTMANAGER_URL, value: "http://alertmanager:9093/alertmanager" }
          ports: [{ name: http, containerPort: 3000 }]
          readinessProbe:
            httpGet: { path: /api/health, port: 3000 }
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet: { path: /api/health, port: 3000 }
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 6
          volumeMounts:
            - { name: data, mountPath: /var/lib/grafana }
            - { name: provisioning, mountPath: /etc/grafana/provisioning }
            - { name: dashboards, mountPath: /var/lib/grafana/dashboards, readOnly: true }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: grafana-data }
        - name: provisioning
          configMap:
            name: grafana-provisioning
            items:
              - { key: datasources.yaml, path: datasources/datasources.yaml }
              - { key: dashboards.yaml, path: dashboards/dashboards.yaml }
        - name: dashboards
          configMap: { name: grafana-dashboards }
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: ai-remediation
spec:
  selector: { app.kubernetes.io/name: grafana }
  ports: [{ name: http, port: 3000, targetPort: 3000 }]

# ---------------------------------------------------------------- redis-exporter (queue depth)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-exporter
  namespace: ai-remediation
  labels: { app.kubernetes.io/name: redis-exporter, app.kubernetes.io/part-of: tsg-observability }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: redis-exporter }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis-exporter
        app.kubernetes.io/component: redis-exporter
        app.kubernetes.io/part-of: tsg-observability
        tsg-observability: "true"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9121"
        prometheus.io/path: /metrics
    spec:
      imagePullSecrets: [{ name: quay-pull }]
      containers:
        - name: redis-exporter
          image: quay-quay-registry.apps.dda-desc-az1-01.desccii.local/dda-desc/redis_exporter:v1.93.0
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities: { drop: [ALL] }
            seccompProfile: { type: RuntimeDefault }
          imagePullPolicy: IfNotPresent
          env:
            # The app's own broker URL (password included): one copy, so a password change reaches both.
            - name: REDIS_ADDR
              valueFrom: { secretKeyRef: { name: tsg-secrets, key: CII_REDIS_CELERY_BROKER_URL } }
            - name: REDIS_DB
              valueFrom: { secretKeyRef: { name: tsg-monitoring, key: REDIS_DB } }
            # Each Celery queue is a Redis list named <Worker.BROKER_KEY_PREFIX><queue>: its length = jobs waiting.
            - name: REDIS_EXPORTER_CHECK_SINGLE_KEYS
              value: "db$(REDIS_DB)=tsg:tsg_threats,db$(REDIS_DB)=tsg:tsg_scenarios,db$(REDIS_DB)=tsg:tsg_maintenance"
            - { name: REDIS_EXPORTER_INCL_SYSTEM_METRICS, value: "false" }
          ports: [{ name: metrics, containerPort: 9121 }]
          readinessProbe:
            httpGet: { path: /health, port: 9121 }
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet: { path: /health, port: 9121 }
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { cpu: 100m, memory: 128Mi }

# ---------------------------------------------------------------- kube-state-metrics (restarts, OOM)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics
  namespace: ai-remediation
  labels: { app.kubernetes.io/name: kube-state-metrics, app.kubernetes.io/part-of: tsg-observability }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: kube-state-metrics }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-state-metrics
        app.kubernetes.io/component: kube-state-metrics
        app.kubernetes.io/part-of: tsg-observability
        tsg-observability: "true"
    spec:
      serviceAccountName: kube-state-metrics
      imagePullSecrets: [{ name: quay-pull }]
      containers:
        - name: kube-state-metrics
          image: quay-quay-registry.apps.dda-desc-az1-01.desccii.local/dda-desc/kube-state-metrics:v2.20.0
          imagePullPolicy: IfNotPresent
          # Both projects the app's pods run in (restarts, OOM kills, pods that never start).
          args: ["--namespaces=ai-threatgen,ai-remediation", --resources=pods]
          ports: [{ name: metrics, containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 20
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { cpu: 100m, memory: 192Mi }
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities: { drop: [ALL] }
            seccompProfile: { type: RuntimeDefault }
---
apiVersion: v1
kind: Service
metadata:
  name: kube-state-metrics
  namespace: ai-remediation
spec:
  selector: { app.kubernetes.io/name: kube-state-metrics }
  ports: [{ name: metrics, port: 8080, targetPort: 8080 }]

