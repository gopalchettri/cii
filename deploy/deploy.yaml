# 3 threads: one for each long task kind on its queue, plus one so the reaper always finds a free thread.
# Half a CPU (BLUEPRINT §23 says 1): its jobs mostly wait on the stores and the AI, and this keeps the project in
# its budget; a library or ATT&CK rebuild takes longer, nothing fails.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-maintenance
  namespace: ai-threatgen
  labels: { app.kubernetes.io/name: worker-maintenance, app.kubernetes.io/part-of: tsg }
spec:
  replicas: 1
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  selector:
    matchLabels: { app.kubernetes.io/name: worker-maintenance }
  template:
    metadata:
      labels: { app.kubernetes.io/name: worker-maintenance, app.kubernetes.io/part-of: tsg, app.kubernetes.io/component: worker }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
        prometheus.io/path: /metrics
        tsg/settings-fingerprint: none
    spec:
      hostAliases: [{ ip: "10.231.255.253", hostnames: [llmapi.govai.ae] }]
      imagePullSecrets: [{ name: quay-pull }]
      terminationGracePeriodSeconds: 120
      containers:
        - name: worker
          image: quay-quay-registry.apps.dda-desc-az1-01.desccii.local/dda-desc/tsg-api:v2-COMMIT
          imagePullPolicy: IfNotPresent
          command: [celery, -A, app.worker, worker, --pool=threads, -c, "3", -Q, tsg_maintenance]
          envFrom:
            - configMapRef: { name: tsg-config }
            - secretRef: { name: tsg-secrets }
          env:
            - { name: HTTP_PROXY, value: "http://10.61.192.2:8080" }
            - { name: HTTPS_PROXY, value: "http://10.61.192.2:8080" }
            - { name: NO_PROXY, value: "localhost,127.0.0.1,.svc,.cluster.local" }
          ports: [{ name: metrics, containerPort: 9100 }]
          livenessProbe:
            exec: { command: [sh, -c, 'celery -A app.worker inspect ping -d "celery@$HOSTNAME" --timeout 10'] }
            initialDelaySeconds: 120
            periodSeconds: 60
            timeoutSeconds: 30
            failureThreshold: 3
          resources:
            requests: { cpu: 250m, memory: 1Gi }
            limits: { cpu: 500m, memory: 2Gi }
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities: { drop: [ALL] }
            seccompProfile: { type: RuntimeDefault }

# ---------------------------------------------------------------- beat: exactly one, ever, and only here
# Two beats would send every scheduled job twice: one replica, Recreate (the old pod is gone before the new one
# starts), no disruption budget, and never a copy in ai-remediation.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: beat
  namespace: ai-threatgen
  labels: { app.kubernetes.io/name: beat, app.kubernetes.io/part-of: tsg }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: beat }
  template:
    metadata:
      labels: { app.kubernetes.io/name: beat, app.kubernetes.io/part-of: tsg, app.kubernetes.io/component: beat }
      annotations: { tsg/settings-fingerprint: none }
    spec:
      hostAliases: [{ ip: "10.231.255.253", hostnames: [llmapi.govai.ae] }]
      imagePullSecrets: [{ name: quay-pull }]
      containers:
        - name: beat
          image: quay-quay-registry.apps.dda-desc-az1-01.desccii.local/dda-desc/tsg-api:v2-COMMIT
          imagePullPolicy: IfNotPresent
          command: [celery, -A, app.worker, beat, -s, /tmp/beat/schedule]
          envFrom:
            - configMapRef: { name: tsg-config }
            - secretRef: { name: tsg-secrets }
          env:
            - { name: HTTP_PROXY, value: "http://10.61.192.2:8080" }
            - { name: HTTPS_PROXY, value: "http://10.61.192.2:8080" }
            - { name: NO_PROXY, value: "localhost,127.0.0.1,.svc,.cluster.local" }
          # Beat has no ping: alive = it saved its schedule in the last 6 minutes (it saves every ~3).
          livenessProbe:
            exec: { command: [sh, -c, "find /tmp/beat -name 'schedule*' -newermt '-360 seconds' | grep -q ."] }
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          volumeMounts: [{ name: schedule, mountPath: /tmp/beat }]
          # Importing app.worker costs about 255 MB (litellm about 160 MB of it): 320Mi covers it.
          resources:
            requests: { cpu: 50m, memory: 320Mi }
            limits: { cpu: 250m, memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities: { drop: [ALL] }
            seccompProfile: { type: RuntimeDefault }
      # Nothing to keep: the schedule is "every N seconds", so a new pod starts a fresh one.
      volumes: [{ name: schedule, emptyDir: {} }]

# ---------------------------------------------------------------- Service, Route, disruption budget
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: ai-threatgen
  labels: { app.kubernetes.io/part-of: tsg }
spec:
  selector: { app.kubernetes.io/name: api }
  ports: [{ name: http, port: 8000, targetPort: 8000 }]

# v1's address, now over https (http is redirected). v1's own Route on this host is removed by deploy-uat.ps1
# (after asking; a copy is kept for the rollback): two Routes cannot share a host and path.
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: api
  namespace: ai-threatgen
  labels: { app.kubernetes.io/part-of: tsg }
spec:
  host: threatgen-api.apps.dda-desc-az1-01.desccii.local
  path: /
  to: { kind: Service, name: api }
  port: { targetPort: http }
  tls: { termination: edge, insecureEdgeTerminationPolicy: Redirect }

# A node drain never takes the API's last copy.
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api
  namespace: ai-threatgen
  labels: { app.kubernetes.io/part-of: tsg }
spec:
  minAvailable: 1
  selector: { matchLabels: { app.kubernetes.io/name: api } }
