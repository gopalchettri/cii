# ---------------------------------------------------------------- volumes (21 Gi in all)
---
apiVersion: v1                                   # core API version
kind: PersistentVolumeClaim                      # a disk that outlives the pod
metadata:                                        # the object's name and place
  name: prometheus-data                          # volume name (the prometheus Deployment mounts it)
  namespace: ai-common                           # project
  labels: { part-of: tsg-monitoring }            # marks it as TSG's monitoring
spec:                                            # the disk wanted
  accessModes: [ReadWriteOnce]                   # one pod writes at a time
  resources:                                     # size
    requests:                                    # asked for
      storage: 10Gi                              # 15 days of metrics (Prometheus stops at 8 GB)
---
apiVersion: v1                                   # core API version
kind: PersistentVolumeClaim                      # a disk that outlives the pod
metadata:                                        # the object's name and place
  name: loki-data                                # volume name (the loki Deployment mounts it)
  namespace: ai-common                           # project
  labels: { part-of: tsg-monitoring }            # marks it as TSG's monitoring
spec:                                            # the disk wanted
  accessModes: [ReadWriteOnce]                   # one pod writes at a time
  resources:                                     # size
    requests:                                    # asked for
      storage: 10Gi                              # 7 days of logs
---
apiVersion: v1                                   # core API version
kind: PersistentVolumeClaim                      # a disk that outlives the pod
metadata:                                        # the object's name and place
  name: grafana-data                             # volume name (the grafana Deployment mounts it)
  namespace: ai-common                           # project
  labels: { part-of: tsg-monitoring }            # marks it as TSG's monitoring
spec:                                            # the disk wanted
  accessModes: [ReadWriteOnce]                   # one pod writes at a time
  resources:                                     # size
    requests:                                    # asked for
      storage: 1Gi                               # Grafana's own small database

# ---------------------------------------------------------------- Prometheus (metrics, 15 days)
---
apiVersion: apps/v1                              # Deployment API version
kind: Deployment                                 # keeps one Prometheus running
metadata:                                        # the object's name and place
  name: prometheus                               # Deployment name
  namespace: ai-common                           # project
  labels: { app: prometheus, part-of: tsg-monitoring }   # labels on the Deployment itself
spec:                                            # what to run
  replicas: 1                                    # one copy
  strategy: { type: Recreate }                   # the old pod stops before the new one starts: one writer on a ReadWriteOnce volume
  selector:                                      # which pods belong to this Deployment
    matchLabels: { app: prometheus }             # pods labelled app=prometheus (cannot change after creation)
  template:                                      # the pod to run
    metadata:                                    # pod labels
      labels: { app: prometheus, component: prometheus, part-of: tsg-monitoring }   # component becomes Prometheus' job name; part-of selects the network rules
    spec:                                        # pod settings
      enableServiceLinks: false                  # no <SERVICE>_PORT variables from the project's Services (Flower read FLOWER_PORT as its port)
      serviceAccountName: prometheus             # runs as the prometheus identity (may read pods)
      imagePullSecrets: [{ name: quay-pull }]    # login for the image registry (Quay)
      containers:                                # the programs in the pod
        - name: prometheus                       # container name
          image: quay-quay-registry.apps.dda-desc-az1-01.desccii.local/dda-desc/prometheus:v3.15.0   # Prometheus, built on UBI 9 (deploy\build-monitoring-images.bat)
          securityContext:                       # locked down
            allowPrivilegeEscalation: false      # cannot gain more rights
            runAsNonRoot: true                   # never runs as root
            capabilities: { drop: [ALL] }        # no special Linux rights
            seccompProfile: { type: RuntimeDefault }   # the default system-call filter
          imagePullPolicy: IfNotPresent          # a tag never changes content: pull only if missing
          args:                                  # start-up options
            - --config.file=/etc/prometheus/prometheus.yml   # what to scrape (prometheus-config)
            - --storage.tsdb.path=/prometheus    # metrics are kept on the volume
            - --storage.tsdb.retention.time=15d  # keep 15 days
            - --storage.tsdb.retention.size=8GB  # and never more than 8 GB (the volume is 10 Gi)
            - --web.external-url=http://localhost:9090/prometheus/   # the address in its links: the guide's oc port-forward (it serves under /prometheus; no Route)
          ports: [{ name: http, containerPort: 9090 }]   # Prometheus' port
          readinessProbe:                        # "ready" = may receive requests
            httpGet: { path: /prometheus/-/ready, port: 9090 }   # Prometheus' own ready check
            initialDelaySeconds: 20              # first check after 20 s
            periodSeconds: 10                    # then every 10 s
            timeoutSeconds: 5                    # each check may take 5 s
            failureThreshold: 6                  # 6 failures in a row = not ready
          livenessProbe:                         # "alive" = the process answers; failing restarts the container
            httpGet: { path: /prometheus/-/healthy, port: 9090 }   # Prometheus' own health check
            initialDelaySeconds: 60              # first check after 1 minute
            periodSeconds: 20                    # then every 20 s
            timeoutSeconds: 5                    # each check may take 5 s
            failureThreshold: 6                  # 6 failures in a row = restart
          volumeMounts:                          # folders from the volumes below
            - { name: config, mountPath: /etc/prometheus }   # prometheus.yml and rules.yml
            - { name: data, mountPath: /prometheus }   # the stored metrics
          resources:                             # CPU and memory
            requests: { cpu: 100m, memory: 512Mi }   # reserved for the pod
            limits: { cpu: 500m, memory: 1Gi }   # the most it may use
      volumes:                                   # where the folders come from
        - name: config                           # the config files
          configMap: { name: prometheus-config }   # from configmap.yaml
        - name: data                             # the stored metrics
          persistentVolumeClaim: { claimName: prometheus-data }   # the prometheus-data volume above
---
apiVersion: v1                                   # core API version
kind: Service                                    # one stable address in front of the pod
metadata:                                        # the object's name and place
  name: prometheus                               # Service name (Grafana uses it)
  namespace: ai-common                           # project
  labels: { part-of: tsg-monitoring }            # marks it as TSG's monitoring
spec:                                            # what it does
  selector: { app: prometheus, part-of: tsg-monitoring }   # sends traffic to TSG's Prometheus pod only (never a chatbot pod labelled app=prometheus)
  ports: [{ name: http, port: 9090, targetPort: 9090 }]   # port 9090 to the pod's port 9090

# ---------------------------------------------------------------- Alertmanager (no alert channel yet)
---
apiVersion: apps/v1                              # Deployment API version
kind: Deployment                                 # keeps one Alertmanager running
metadata:                                        # the object's name and place
  name: alertmanager                             # Deployment name
  namespace: ai-common                           # project
  labels: { app: alertmanager, part-of: tsg-monitoring }   # labels on the Deployment itself
spec:                                            # what to run
  replicas: 1                                    # one copy
  selector:                                      # which pods belong to this Deployment
    matchLabels: { app: alertmanager }           # pods labelled app=alertmanager
  template:                                      # the pod to run
    metadata:                                    # pod labels and notes
      labels: { app: alertmanager, component: alertmanager, part-of: tsg-monitoring }   # component becomes Prometheus' job name
      annotations:                               # notes read by Prometheus
        prometheus.io/scrape: "true"             # Prometheus collects this pod's metrics
        prometheus.io/port: "9093"               # on this port
        prometheus.io/path: /alertmanager/metrics   # at this path
    spec:                                        # pod settings
      enableServiceLinks: false                  # no <SERVICE>_PORT variables from the project's Services (Flower read FLOWER_PORT as its port)
      imagePullSecrets: [{ name: quay-pull }]    # login for the image registry
      containers:                                # the programs in the pod
        - name: alertmanager                     # container name
          image: quay-quay-registry.apps.dda-desc-az1-01.desccii.local/dda-desc/alertmanager:v0.34.1   # Alertmanager, built on UBI 9 (deploy\build-monitoring-images.bat)
          securityContext:                       # locked down
            allowPrivilegeEscalation: false      # cannot gain more rights
            runAsNonRoot: true                   # never runs as root
            capabilities: { drop: [ALL] }        # no special Linux rights
            seccompProfile: { type: RuntimeDefault }   # the default system-call filter
          imagePullPolicy: IfNotPresent          # pull only if missing
          args:                                  # start-up options
            - --config.file=/etc/alertmanager/alertmanager.yml   # receivers and routing (alertmanager-config)
            - --storage.path=/alertmanager       # silences live on a scratch folder and are lost on restart (ponytail: add a volume if that hurts)
            - --web.external-url=http://localhost:9093/alertmanager/   # the address in its links: the guide's oc port-forward (it serves under /alertmanager; no Route)
            - --cluster.listen-address=          # one Alertmanager: no peers to find
          ports: [{ name: http, containerPort: 9093 }]   # Alertmanager's port
          readinessProbe:                        # "ready" = may receive requests
            httpGet: { path: /alertmanager/-/ready, port: 9093 }   # Alertmanager's own ready check
            initialDelaySeconds: 10              # first check after 10 s
            periodSeconds: 10                    # then every 10 s
            timeoutSeconds: 5                    # each check may take 5 s
            failureThreshold: 3                  # 3 failures in a row = not ready
          livenessProbe:                         # "alive" = the process answers; failing restarts the container
            httpGet: { path: /alertmanager/-/healthy, port: 9093 }   # Alertmanager's own health check
            initialDelaySeconds: 30              # first check after 30 s
            periodSeconds: 20                    # then every 20 s
            timeoutSeconds: 5                    # each check may take 5 s
            failureThreshold: 6                  # 6 failures in a row = restart
          volumeMounts:                          # folders from the volumes below
            - { name: config, mountPath: /etc/alertmanager }   # alertmanager.yml
            - { name: data, mountPath: /alertmanager }   # silences and notification state
          resources:                             # CPU and memory
            requests: { cpu: 25m, memory: 64Mi }   # reserved for the pod
            limits: { cpu: 100m, memory: 256Mi }   # the most it may use
      volumes:                                   # where the folders come from
        - name: config                           # the config file
          configMap: { name: alertmanager-config }   # from configmap.yaml
        - name: data                             # silences
          emptyDir: {}                           # a scratch folder, emptied when the pod stops
---
apiVersion: v1                                   # core API version
kind: Service                                    # one stable address in front of the pod
metadata:                                        # the object's name and place
  name: alertmanager                             # Service name (Prometheus and Grafana use it)
  namespace: ai-common                           # project
  labels: { part-of: tsg-monitoring }            # marks it as TSG's monitoring
spec:                                            # what it does
  selector: { app: alertmanager, part-of: tsg-monitoring }   # sends traffic to TSG's Alertmanager pod only (never a chatbot pod labelled app=alertmanager)
  ports: [{ name: http, port: 9093, targetPort: 9093 }]   # port 9093 to the pod's port 9093

# ---------------------------------------------------------------- Loki (logs, 7 days)
---
apiVersion: apps/v1                              # Deployment API version
kind: Deployment                                 # keeps one Loki running
metadata:                                        # the object's name and place
  name: loki                                     # Deployment name
  namespace: ai-common                           # project
  labels: { app: loki, part-of: tsg-monitoring }   # labels on the Deployment itself
spec:                                            # what to run
  replicas: 1                                    # one copy
  strategy: { type: Recreate }                   # the old pod stops before the new one starts: one writer on a ReadWriteOnce volume
  selector:                                      # which pods belong to this Deployment
    matchLabels: { app: loki }                   # pods labelled app=loki
  template:                                      # the pod to run
    metadata:                                    # pod labels and notes
      labels: { app: loki, component: loki, part-of: tsg-monitoring }   # component becomes Prometheus' job name
      annotations:                               # notes read by Prometheus
        prometheus.io/scrape: "true"             # Prometheus collects this pod's metrics
        prometheus.io/port: "3100"               # on this port
        prometheus.io/path: /metrics             # at this path
    spec:                                        # pod settings
      enableServiceLinks: false                  # no <SERVICE>_PORT variables from the project's Services (Flower read FLOWER_PORT as its port)
      serviceAccountName: loki                   # runs as the loki identity, not the project's shared default
      imagePullSecrets: [{ name: quay-pull }]    # login for the image registry
      containers:                                # the programs in the pod
        - name: loki                             # container name
          image: quay-quay-registry.apps.dda-desc-az1-01.desccii.local/dda-desc/loki:3.7.8   # Loki, built on UBI 9 (deploy\build-monitoring-images.bat)
          securityContext:                       # locked down
            allowPrivilegeEscalation: false      # cannot gain more rights
            runAsNonRoot: true                   # never runs as root
            capabilities: { drop: [ALL] }        # no special Linux rights
            seccompProfile: { type: RuntimeDefault }   # the default system-call filter
          imagePullPolicy: IfNotPresent          # pull only if missing
          args: [-config.file=/etc/loki/loki.yaml, -config.expand-env=true, -target=all]   # its config (loki-config), with ${...} filled from the environment, all parts in one process
          env:                                   # values the config file reads
            - { name: LOKI_DATA, value: /loki }  # where Loki keeps its data (the volume)
          ports:                                 # Loki's ports
            - { name: http, containerPort: 3100 }   # the API (Alloy writes, Grafana reads)
            - { name: grpc, containerPort: 9095 }   # internal calls between its parts
          readinessProbe:                        # "ready" = may receive requests
            httpGet: { path: /ready, port: 3100 }   # Loki's own ready check
            initialDelaySeconds: 30              # first check after 30 s
            periodSeconds: 10                    # then every 10 s
            timeoutSeconds: 5                    # each check may take 5 s
            failureThreshold: 6                  # 6 failures in a row = not ready
          livenessProbe:                         # "alive" = the process answers; failing restarts the container
            httpGet: { path: /ready, port: 3100 }   # the same check, with more patience
            initialDelaySeconds: 90              # first check after 90 s
            periodSeconds: 30                    # then every 30 s
            timeoutSeconds: 10                   # each check may take 10 s
            failureThreshold: 10                 # 10 failures in a row = restart
          volumeMounts:                          # folders from the volumes below
            - { name: config, mountPath: /etc/loki }   # loki.yaml
            - { name: data, mountPath: /loki }   # the stored logs
          resources:                             # CPU and memory
            requests: { cpu: 100m, memory: 256Mi }   # reserved for the pod
            limits: { cpu: 500m, memory: 1Gi }   # the most it may use
      volumes:                                   # where the folders come from
        - name: config                           # the config file
          configMap: { name: loki-config }       # from configmap.yaml
        - name: data                             # the stored logs
          persistentVolumeClaim: { claimName: loki-data }   # the loki-data volume above
---
apiVersion: v1                                   # core API version
kind: Service                                    # one stable address in front of the pod
metadata:                                        # the object's name and place
  name: loki                                     # Service name (Alloy and Grafana use it)
  namespace: ai-common                           # project
  labels: { part-of: tsg-monitoring }            # marks it as TSG's monitoring
spec:                                            # what it does
  selector: { app: loki, part-of: tsg-monitoring }   # sends traffic to TSG's Loki pod only (never a chatbot pod labelled app=loki)
  ports: [{ name: http, port: 3100, targetPort: 3100 }]   # port 3100 to the pod's port 3100

# ---------------------------------------------------------------- Alloy (the pods' logs -> Loki)
---
apiVersion: apps/v1                              # Deployment API version
kind: Deployment                                 # keeps one Alloy running
metadata:                                        # the object's name and place
  name: alloy                                    # Deployment name
  namespace: ai-common                           # project
  labels: { app: alloy, part-of: tsg-monitoring }   # labels on the Deployment itself
spec:                                            # what to run
  replicas: 1                                    # one reader: two would ship every line twice
  strategy: { type: Recreate }                   # the old pod stops before the new one starts: never two readers
  selector:                                      # which pods belong to this Deployment
    matchLabels: { app: alloy }                  # pods labelled app=alloy
  template:                                      # the pod to run
    metadata:                                    # pod labels and notes
      labels: { app: alloy, component: alloy, part-of: tsg-monitoring }   # component becomes Prometheus' job name
      annotations:                               # notes read by Prometheus
        prometheus.io/scrape: "true"             # Prometheus collects this pod's metrics
        prometheus.io/port: "12345"              # on this port
        prometheus.io/path: /metrics             # at this path
    spec:                                        # pod settings
      enableServiceLinks: false                  # no <SERVICE>_PORT variables from the project's Services (Flower read FLOWER_PORT as its port)
      serviceAccountName: alloy                  # runs as the alloy identity (may read pods and their logs)
      imagePullSecrets: [{ name: quay-pull }]    # login for the image registry
      containers:                                # the programs in the pod
        - name: alloy                            # container name
          image: quay-quay-registry.apps.dda-desc-az1-01.desccii.local/dda-desc/alloy:v1.20.1   # Alloy, built on UBI 9 (deploy\build-monitoring-images.bat)
          securityContext:                       # locked down
            allowPrivilegeEscalation: false      # cannot gain more rights
            runAsNonRoot: true                   # never runs as root
            capabilities: { drop: [ALL] }        # no special Linux rights
            seccompProfile: { type: RuntimeDefault }   # the default system-call filter
          imagePullPolicy: IfNotPresent          # pull only if missing
          args:                                  # start-up options
            - run                                # run a config
            - /etc/alloy/config.alloy            # this one (alloy-config): which pods' logs to read
            - --server.http.listen-addr=0.0.0.0:12345   # its own web port (metrics, health)
            - --storage.path=/tmp/alloy          # where it remembers how far it has read
            - --disable-reporting                # sends no usage data to Grafana Labs
          ports: [{ name: http, containerPort: 12345 }]   # Alloy's port
          readinessProbe:                        # "ready" = working
            httpGet: { path: /-/ready, port: 12345 }   # Alloy's own ready check
            initialDelaySeconds: 10              # first check after 10 s
            periodSeconds: 10                    # then every 10 s
            timeoutSeconds: 5                    # each check may take 5 s
            failureThreshold: 3                  # 3 failures in a row = not ready
          livenessProbe:                         # "alive" = the process answers; failing restarts the container
            httpGet: { path: /-/ready, port: 12345 }   # the same check, with more patience
            initialDelaySeconds: 30              # first check after 30 s
            periodSeconds: 20                    # then every 20 s
            timeoutSeconds: 5                    # each check may take 5 s
            failureThreshold: 6                  # 6 failures in a row = restart
          volumeMounts:                          # folders from the volumes below
            - { name: config, mountPath: /etc/alloy }   # config.alloy
            - { name: data, mountPath: /tmp/alloy }   # its read positions
          resources:                             # CPU and memory
            requests: { cpu: 50m, memory: 128Mi }   # reserved for the pod
            limits: { cpu: 300m, memory: 512Mi }   # the most it may use
      volumes:                                   # where the folders come from
        - name: config                           # the config file
          configMap: { name: alloy-config }      # from configmap.yaml
        - name: data                             # read positions
          emptyDir: {}                           # a scratch folder, emptied when the pod stops

# ---------------------------------------------------------------- Grafana (the one place to look)
---
apiVersion: apps/v1                              # Deployment API version
kind: Deployment                                 # keeps one Grafana running
metadata:                                        # the object's name and place
  name: grafana                                  # Deployment name
  namespace: ai-common                           # project
  labels: { app: grafana, part-of: tsg-monitoring }   # labels on the Deployment itself
spec:                                            # what to run
  replicas: 1                                    # one copy
  strategy: { type: Recreate }                   # the old pod stops before the new one starts: one writer on a ReadWriteOnce volume
  selector:                                      # which pods belong to this Deployment
    matchLabels: { app: grafana }                # pods labelled app=grafana
  template:                                      # the pod to run
    metadata:                                    # pod labels
      labels: { app: grafana, component: grafana, part-of: tsg-monitoring }   # component names it in the logs
    spec:                                        # pod settings
      enableServiceLinks: false                  # no <SERVICE>_PORT variables from the project's Services (Flower read FLOWER_PORT as its port)
      serviceAccountName: grafana                # runs as the grafana identity, not the project's shared default
      imagePullSecrets: [{ name: quay-pull }]    # login for the image registry
      initContainers:                            # runs to the end before Grafana starts
        - name: set-admin-password               # Grafana reads the admin password only when it creates its database: this sets a changed one
          image: quay-quay-registry.apps.dda-desc-az1-01.desccii.local/dda-desc/grafana:12.4.12   # the same Grafana image (it has the grafana cli)
          imagePullPolicy: IfNotPresent          # pull only if missing
          securityContext:                       # locked down
            allowPrivilegeEscalation: false      # cannot gain more rights
            runAsNonRoot: true                   # never runs as root
            capabilities: { drop: [ALL] }        # no special Linux rights
            seccompProfile: { type: RuntimeDefault }   # the default system-call filter
          command: [sh, -c]                      # run the shell line below
          args:                                  # the shell line
            - >-                                 # if Grafana's database exists, reset the admin password to the one in the Secret
              if [ -f /var/lib/grafana/grafana.db ]; then
              printf '%s' "$GF_SECURITY_ADMIN_PASSWORD" | grafana cli --homepath /usr/share/grafana
              admin reset-admin-password --password-from-stdin; fi
          env:                                   # its one setting
            - name: GF_SECURITY_ADMIN_PASSWORD   # the admin password
              valueFrom: { secretKeyRef: { name: tsg-monitoring, key: GF_SECURITY_ADMIN_PASSWORD } }   # from Secret tsg-monitoring (secrets.yaml)
          volumeMounts:                          # folders from the volumes below
            - { name: data, mountPath: /var/lib/grafana }   # Grafana's database
          resources:                             # CPU and memory
            requests: { cpu: 50m, memory: 64Mi }   # reserved while it runs
            limits: { cpu: 200m, memory: 256Mi }   # the most it may use
      containers:                                # the programs in the pod
        - name: grafana                          # container name
          image: quay-quay-registry.apps.dda-desc-az1-01.desccii.local/dda-desc/grafana:12.4.12   # Grafana, built on UBI 9 (deploy\build-monitoring-images.bat)
          securityContext:                       # locked down
            allowPrivilegeEscalation: false      # cannot gain more rights
            runAsNonRoot: true                   # never runs as root
            capabilities: { drop: [ALL] }        # no special Linux rights
            seccompProfile: { type: RuntimeDefault }   # the default system-call filter
          imagePullPolicy: IfNotPresent          # pull only if missing
          env:                                   # Grafana's settings
            - name: GF_SECURITY_ADMIN_PASSWORD   # the admin password: only to change Grafana, looking needs no login
              valueFrom: { secretKeyRef: { name: tsg-monitoring, key: GF_SECURITY_ADMIN_PASSWORD } }   # from Secret tsg-monitoring (secrets.yaml)
            - { name: GF_AUTH_ANONYMOUS_ENABLED, value: "true" }   # anyone may look without a login
            - { name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: "Viewer" }   # ... but only look, never change
            - { name: GF_ANALYTICS_REPORTING_ENABLED, value: "false" }   # sends no usage data to Grafana Labs
            - { name: GF_SERVER_ENABLE_GZIP, value: "true" }   # compressed answers: fewer bytes through the router and the proxy
            - { name: GF_METRICS_ENABLED, value: "false" }   # no /metrics page of its own: nothing scrapes it, and it would be public
            - { name: GF_SERVER_ROOT_URL, value: "https://threatgen-api.apps.dda-desc-az1-01.desccii.local/grafana/" }   # its public address (the API's host, through the monitoring proxy), for links
            - { name: GF_SERVER_SERVE_FROM_SUB_PATH, value: "true" }   # it serves under /grafana
            - { name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH, value: /var/lib/grafana/dashboards/tsg.json }   # the TSG dashboard is the home page
            - { name: GRAFANA_DASHBOARDS, value: /var/lib/grafana/dashboards }   # the folder dashboards.yaml loads dashboards from
            - { name: PROMETHEUS_URL, value: "http://prometheus:9090/prometheus" }   # data source: Prometheus (datasources.yaml reads it)
            - { name: LOKI_URL, value: "http://loki:3100" }   # data source: Loki
            - { name: ALERTMANAGER_URL, value: "http://alertmanager:9093/alertmanager" }   # data source: Alertmanager
          ports: [{ name: http, containerPort: 3000 }]   # Grafana's port
          readinessProbe:                        # "ready" = may receive requests
            httpGet: { path: /api/health, port: 3000 }   # Grafana's own health check
            initialDelaySeconds: 20              # first check after 20 s
            periodSeconds: 10                    # then every 10 s
            timeoutSeconds: 5                    # each check may take 5 s
            failureThreshold: 6                  # 6 failures in a row = not ready
          livenessProbe:                         # "alive" = the process answers; failing restarts the container
            httpGet: { path: /api/health, port: 3000 }   # the same check, with more patience
            initialDelaySeconds: 60              # first check after 1 minute
            periodSeconds: 30                    # then every 30 s
            timeoutSeconds: 10                   # each check may take 10 s
            failureThreshold: 6                  # 6 failures in a row = restart
          volumeMounts:                          # folders from the volumes below
            - { name: data, mountPath: /var/lib/grafana }   # Grafana's database
            - { name: provisioning, mountPath: /etc/grafana/provisioning }   # data sources and the dashboard folder, read at start
            - { name: dashboards, mountPath: /var/lib/grafana/dashboards, readOnly: true }   # the TSG dashboard
          resources:                             # CPU and memory
            requests: { cpu: 100m, memory: 256Mi }   # reserved for the pod
            limits: { cpu: 500m, memory: 512Mi }   # the most it may use
      volumes:                                   # where the folders come from
        - name: data                             # Grafana's database
          persistentVolumeClaim: { claimName: grafana-data }   # the grafana-data volume above
        - name: provisioning                     # Grafana's start-up files
          configMap:                             # from configmap.yaml
            name: grafana-provisioning           # ConfigMap name
            items:                               # each key to the sub-folder Grafana looks in
              - { key: datasources.yaml, path: datasources/datasources.yaml }   # the data sources
              - { key: dashboards.yaml, path: dashboards/dashboards.yaml }   # where the dashboards are
        - name: dashboards                       # the dashboard
          configMap: { name: grafana-dashboards }   # from configmap.yaml (tsg.json)
---
apiVersion: v1                                   # core API version
kind: Service                                    # one stable address in front of the pod
metadata:                                        # the object's name and place
  name: grafana                                  # Service name (the monitoring proxy forwards /grafana to it)
  namespace: ai-common                           # project
  labels: { part-of: tsg-monitoring }            # marks it as TSG's monitoring
spec:                                            # what it does
  selector: { app: grafana, part-of: tsg-monitoring }   # sends traffic to TSG's Grafana pod only (never a chatbot pod labelled app=grafana)
  ports: [{ name: http, port: 3000, targetPort: 3000 }]   # port 3000 to the pod's port 3000

# ---------------------------------------------------------------- redis-exporter (jobs waiting per queue)
---
apiVersion: apps/v1                              # Deployment API version
kind: Deployment                                 # keeps one redis-exporter running
metadata:                                        # the object's name and place
  name: redis-exporter                           # Deployment name
  namespace: ai-common                           # project
  labels: { app: redis-exporter, part-of: tsg-monitoring }   # labels on the Deployment itself
spec:                                            # what to run
  replicas: 1                                    # one copy
  selector:                                      # which pods belong to this Deployment
    matchLabels: { app: redis-exporter }         # pods labelled app=redis-exporter
  template:                                      # the pod to run
    metadata:                                    # pod labels and notes
      labels: { app: redis-exporter, component: redis-exporter, part-of: tsg-monitoring }   # component becomes Prometheus' job name
      annotations:                               # notes read by Prometheus
        prometheus.io/scrape: "true"             # Prometheus collects this pod's metrics
        prometheus.io/port: "9121"               # on this port
        prometheus.io/path: /metrics             # at this path
    spec:                                        # pod settings
      enableServiceLinks: false                  # no <SERVICE>_PORT variables from the project's Services (Flower read FLOWER_PORT as its port)
      imagePullSecrets: [{ name: quay-pull }]    # login for the image registry
      containers:                                # the programs in the pod
        - name: redis-exporter                   # container name
          image: quay-quay-registry.apps.dda-desc-az1-01.desccii.local/dda-desc/redis_exporter:v1.93.0   # redis_exporter, built on UBI 9 (deploy\build-monitoring-images.bat)
          securityContext:                       # locked down
            allowPrivilegeEscalation: false      # cannot gain more rights
            runAsNonRoot: true                   # never runs as root
            capabilities: { drop: [ALL] }        # no special Linux rights
            seccompProfile: { type: RuntimeDefault }   # the default system-call filter
          imagePullPolicy: IfNotPresent          # pull only if missing
          env:                                   # what to read
            - name: REDIS_ADDR                   # the Redis to read: the app's own broker URL (password included)
              valueFrom: { secretKeyRef: { name: tsg-secrets, key: CII_REDIS_CELERY_BROKER_URL } }   # one copy, so a password change reaches both
            - { name: REDIS_DB, value: "1" }     # the job queues are Redis database 1
            - name: REDIS_EXPORTER_CHECK_SINGLE_KEYS   # each queue is two Redis lists, tsg:<queue> (next stages) and tsg:<queue>\x06\x163 (new work): their lengths = jobs waiting
              value: "db$(REDIS_DB)=tsg:tsg_threats,db$(REDIS_DB)=tsg:tsg_threats\x06\x163,db$(REDIS_DB)=tsg:tsg_scenarios,db$(REDIS_DB)=tsg:tsg_scenarios\x06\x163,db$(REDIS_DB)=tsg:tsg_controls,db$(REDIS_DB)=tsg:tsg_controls\x06\x163,db$(REDIS_DB)=tsg:tsg_remediation,db$(REDIS_DB)=tsg:tsg_remediation\x06\x163,db$(REDIS_DB)=tsg:tsg_servicemapper,db$(REDIS_DB)=tsg:tsg_servicemapper\x06\x163,db$(REDIS_DB)=tsg:tsg_maintenance,db$(REDIS_DB)=tsg:tsg_maintenance\x06\x163,db$(REDIS_DB)=tsg:tsg_reaper,db$(REDIS_DB)=tsg:tsg_reaper\x06\x163"   # the seven queues, both lists each
            - { name: REDIS_EXPORTER_INCL_SYSTEM_METRICS, value: "false" }   # no host metrics
          ports: [{ name: metrics, containerPort: 9121 }]   # its metrics port
          readinessProbe:                        # "ready" = may receive requests
            httpGet: { path: /health, port: 9121 }   # its own health check
            initialDelaySeconds: 10              # first check after 10 s
            periodSeconds: 15                    # then every 15 s
          livenessProbe:                         # "alive" = the process answers; failing restarts the container
            httpGet: { path: /health, port: 9121 }   # the same check
            initialDelaySeconds: 30              # first check after 30 s
            periodSeconds: 30                    # then every 30 s
          resources:                             # CPU and memory
            requests: { cpu: 25m, memory: 64Mi }   # reserved for the pod
            limits: { cpu: 100m, memory: 128Mi }   # the most it may use

# ---------------------------------------------------------------- kube-state-metrics (restarts, OOM kills)
---
apiVersion: apps/v1                              # Deployment API version
kind: Deployment                                 # keeps one kube-state-metrics running
metadata:                                        # the object's name and place
  name: kube-state-metrics                       # Deployment name
  namespace: ai-common                           # project
  labels: { app: kube-state-metrics, part-of: tsg-monitoring }   # labels on the Deployment itself
spec:                                            # what to run
  replicas: 1                                    # one copy
  selector:                                      # which pods belong to this Deployment
    matchLabels: { app: kube-state-metrics }     # pods labelled app=kube-state-metrics
  template:                                      # the pod to run
    metadata:                                    # pod labels
      labels: { app: kube-state-metrics, component: kube-state-metrics, part-of: tsg-monitoring }   # component names it in the logs
    spec:                                        # pod settings
      enableServiceLinks: false                  # no <SERVICE>_PORT variables from the project's Services (Flower read FLOWER_PORT as its port)
      serviceAccountName: kube-state-metrics     # runs as the kube-state-metrics identity (may read pods)
      imagePullSecrets: [{ name: quay-pull }]    # login for the image registry
      containers:                                # the programs in the pod
        - name: kube-state-metrics               # container name
          image: quay-quay-registry.apps.dda-desc-az1-01.desccii.local/dda-desc/kube-state-metrics:v2.20.0   # kube-state-metrics, built on UBI 9 (deploy\build-monitoring-images.bat)
          imagePullPolicy: IfNotPresent          # pull only if missing
          args: ["--namespaces=ai-threatgen,ai-remediation,ai-common", --resources=pods]   # the pods of the app's two projects and this one (restarts, OOM kills, pods that never start)
          ports: [{ name: metrics, containerPort: 8080 }]   # its metrics port
          readinessProbe:                        # "ready" = may receive requests
            httpGet: { path: /healthz, port: 8080 }   # its own health check
            initialDelaySeconds: 5               # first check after 5 s
            periodSeconds: 20                    # then every 20 s
          livenessProbe:                         # "alive" = the process answers; failing restarts the container
            httpGet: { path: /healthz, port: 8080 }   # the same check
            initialDelaySeconds: 10              # first check after 10 s
            periodSeconds: 30                    # then every 30 s
          resources:                             # CPU and memory
            requests: { cpu: 20m, memory: 64Mi }   # reserved for the pod
            limits: { cpu: 100m, memory: 192Mi }   # the most it may use
          securityContext:                       # locked down
            allowPrivilegeEscalation: false      # cannot gain more rights
            runAsNonRoot: true                   # never runs as root
            capabilities: { drop: [ALL] }        # no special Linux rights
            seccompProfile: { type: RuntimeDefault }   # the default system-call filter
---
apiVersion: v1                                   # core API version
kind: Service                                    # one stable address in front of the pod
metadata:                                        # the object's name and place
  name: kube-state-metrics                       # Service name (Prometheus scrapes it)
  namespace: ai-common                           # project
  labels: { part-of: tsg-monitoring }            # marks it as TSG's monitoring
spec:                                            # what it does
  selector: { app: kube-state-metrics, part-of: tsg-monitoring }   # sends traffic to TSG's kube-state-metrics pod only (never a chatbot pod with that app label)
  ports: [{ name: metrics, port: 8080, targetPort: 8080 }]   # port 8080 to the pod's port 8080

# ---------------------------------------------------------------- Flower (the live view of the background jobs)
# It runs from the app image and reads the app's settings (the app checks every setting at start). View only:
# without a login Flower switches its own API off. A live view, not a record (runs and the audit are in MongoDB).
---
apiVersion: apps/v1                              # Deployment API version
kind: Deployment                                 # keeps one Flower running
metadata:                                        # the object's name and place
  name: flower                                   # Deployment name
  namespace: ai-common                           # project
  labels: { app: flower, part-of: tsg-monitoring }   # labels on the Deployment itself
spec:                                            # what to run
  replicas: 1                                    # two would each read the job events and show half a picture
  selector:                                      # which pods belong to this Deployment
    matchLabels: { app: flower }                 # pods labelled app=flower
  template:                                      # the pod to run
    metadata:                                    # pod labels and notes
      labels: { app: flower, component: flower, part-of: tsg-monitoring }   # component becomes Prometheus' job name; part-of = the monitoring's network rules
      annotations:                               # notes read by Prometheus
        prometheus.io/scrape: "true"             # Prometheus collects this pod's metrics
        prometheus.io/port: "5555"               # on this port
        prometheus.io/path: /flower/metrics      # at this path
    spec:                                        # pod settings
      enableServiceLinks: false                  # no <SERVICE>_PORT variables from the project's Services (Flower read FLOWER_PORT as its port)
      automountServiceAccountToken: false        # Flower never calls the OpenShift API: no token in the pod
      imagePullSecrets: [{ name: quay-pull }]    # login for the image registry
      containers:                                # the programs in the pod
        - name: flower                           # container name
          image: quay-quay-registry.apps.dda-desc-az1-01.desccii.local/dda-desc/tsg-api:24-Oct-2026   # the TSG image (change the tag per release)
          imagePullPolicy: IfNotPresent          # pull only if missing
          command: [celery, -A, app.worker, flower, --address=0.0.0.0, --port=5555, --url_prefix=flower]   # Flower on port 5555, under /flower
          envFrom:                               # every app setting, as environment variables
            - configMapRef: { name: tsg-config }   # plain settings (configmap.yaml)
            - secretRef: { name: tsg-secrets }   # passwords and connection strings (secrets.yaml): the job queue's address
          ports: [{ name: http, containerPort: 5555 }]   # Flower's port
          readinessProbe:                        # "ready" = may receive requests
            tcpSocket: { port: 5555 }            # the port accepts connections
            initialDelaySeconds: 10              # first check after 10 s
            periodSeconds: 10                    # then every 10 s
          livenessProbe:                         # "alive" = the process answers; failing restarts the container
            tcpSocket: { port: 5555 }            # the port accepts connections
            initialDelaySeconds: 30              # first check after 30 s
            periodSeconds: 30                    # then every 30 s
          resources:                             # CPU and memory
            requests: { cpu: 100m, memory: 256Mi }   # reserved for the pod
            limits: { cpu: 200m, memory: 512Mi }   # the most it may use
          securityContext:                       # locked down
            allowPrivilegeEscalation: false      # cannot gain more rights
            runAsNonRoot: true                   # never runs as root
            capabilities: { drop: [ALL] }        # no special Linux rights
            seccompProfile: { type: RuntimeDefault }   # the default system-call filter
---
apiVersion: v1                                   # core API version
kind: Service                                    # one stable address in front of the pod
metadata:                                        # the object's name and place
  name: flower                                   # Service name (the monitoring proxy forwards /flower to it)
  namespace: ai-common                           # project
  labels: { part-of: tsg-monitoring }            # marks it as TSG's monitoring
spec:                                            # what it does
  selector: { app: flower, part-of: tsg-monitoring }   # sends traffic to TSG's Flower pod only (never a chatbot pod labelled app=flower)
  ports: [{ name: http, port: 5555, targetPort: 5555 }]   # port 5555 to the pod's port 5555

# ---------------------------------------------------------------- the monitoring proxy (in ai-threatgen)
# OpenShift gives a host to one project only, and a Route reaches only a Service of its own project: the API's host
# is ai-threatgen's. So the Routes for /grafana and /flower are there, and point at this nginx, which forwards them
# to Grafana and Flower here in ai-common. Its config: ConfigMap monitoring-proxy (configmap.yaml); its network
# rules: networkpolicy_threatgen.yaml and monitoring-from-proxy below. It lives in this file with the monitoring it
# serves, and build-monitoring-images.bat builds its image with the others.
---
apiVersion: apps/v1                              # Deployment API version
kind: Deployment                                 # keeps one proxy running
metadata:                                        # the object's name and place
  name: monitoring-proxy                         # Deployment name
  namespace: ai-threatgen                        # the API's project: only its Routes may use the API's host
  labels: { app: monitoring-proxy, part-of: tsg-monitoring }   # labels on the Deployment itself
spec:                                            # what to run
  replicas: 1                                    # one copy: it forwards a few people's pages
  strategy: { type: Recreate }                   # the old pod stops before the new one starts: no extra pod in ai-threatgen's quota
  selector:                                      # which pods belong to this Deployment
    matchLabels: { app: monitoring-proxy }       # pods labelled app=monitoring-proxy
  template:                                      # the pod to run
    metadata:                                    # pod labels
      labels: { app: monitoring-proxy, component: monitoring-proxy, part-of: tsg-monitoring }   # component names it in the logs; app selects its network rules
    spec:                                        # pod settings
      enableServiceLinks: false                  # no <SERVICE>_PORT variables from the project's Services
      automountServiceAccountToken: false        # nginx never calls the OpenShift API: no token in the pod
      imagePullSecrets: [{ name: quay-pull }]    # login for the image registry (already in ai-threatgen)
      containers:                                # the programs in the pod
        - name: nginx                            # container name
          image: quay-quay-registry.apps.dda-desc-az1-01.desccii.local/dda-desc/nginx:1.24.0   # nginx, built on Red Hat's UBI 9 nginx image (deploy\build-monitoring-images.bat)
          imagePullPolicy: IfNotPresent          # pull only if missing
          args: [-e, stderr, -c, /etc/nginx/tsg/nginx.conf]   # errors to the pod log from the first line; the config below
          securityContext:                       # locked down
            allowPrivilegeEscalation: false      # cannot gain more rights
            runAsNonRoot: true                   # never runs as root
            capabilities: { drop: [ALL] }        # no special Linux rights
            seccompProfile: { type: RuntimeDefault }   # the default system-call filter
          ports: [{ name: http, containerPort: 8080 }]   # the proxy's port
          readinessProbe:                        # "ready" = may receive requests
            httpGet: { path: /healthz, port: 8080 }   # nginx answers itself (a Grafana restart does not take the proxy out)
            initialDelaySeconds: 5               # first check after 5 s
            periodSeconds: 10                    # then every 10 s
          livenessProbe:                         # "alive" = the process answers; failing restarts the container
            httpGet: { path: /healthz, port: 8080 }   # the same check
            initialDelaySeconds: 10              # first check after 10 s
            periodSeconds: 30                    # then every 30 s
          volumeMounts:                          # folders from the volumes below
            - { name: config, mountPath: /etc/nginx/tsg }   # nginx.conf
          resources:                             # CPU and memory
            requests: { cpu: 50m, memory: 64Mi }   # reserved for the pod: as much as its limit, which the quota counts anyway
            limits: { cpu: 50m, memory: 64Mi }   # the most it may use (TLS ends at the router: it only passes bytes on)
      volumes:                                   # where the folders come from
        - name: config                           # the config file
          configMap: { name: monitoring-proxy }  # from configmap.yaml (nginx.conf)
---
apiVersion: v1                                   # core API version
kind: Service                                    # one stable address in front of the pod
metadata:                                        # the object's name and place
  name: monitoring-proxy                         # Service name (the two Routes below use it)
  namespace: ai-threatgen                        # the proxy's project
  labels: { part-of: tsg-monitoring }            # marks it as TSG's monitoring
spec:                                            # what it does
  selector: { app: monitoring-proxy }            # sends traffic to the pods labelled app=monitoring-proxy
  ports: [{ name: http, port: 8080, targetPort: 8080 }]   # port 8080 to the pod's port 8080

# ---------------------------------------------------------------- public paths on the API's host (in ai-threatgen)
# The API's Route (deploy_threatgen.yaml) takes every other path: the router picks the longest path that matches.
---
apiVersion: route.openshift.io/v1                # OpenShift Route API version
kind: Route                                      # a public https address
metadata:                                        # the object's name and place
  name: grafana                                  # Route name
  namespace: ai-threatgen                        # the API's project, which owns the host
  labels: { part-of: tsg-monitoring }            # marks it as TSG's monitoring
spec:                                            # what it does
  host: threatgen-api.apps.dda-desc-az1-01.desccii.local   # the API's host
  path: /grafana                                 # this path (the API has none under it)
  to: { kind: Service, name: monitoring-proxy }  # forwards to the monitoring proxy, which forwards to Grafana
  port: { targetPort: http }                     # on its http port
  tls: { termination: edge, insecureEdgeTerminationPolicy: Redirect }   # https at the router; http is redirected to https
---
apiVersion: route.openshift.io/v1                # OpenShift Route API version
kind: Route                                      # a public https address
metadata:                                        # the object's name and place
  name: flower                                   # Route name
  namespace: ai-threatgen                        # the API's project, which owns the host
  labels: { part-of: tsg-monitoring }            # marks it as TSG's monitoring
spec:                                            # what it does
  host: threatgen-api.apps.dda-desc-az1-01.desccii.local   # the API's host
  path: /flower                                  # this path (the API has none under it)
  to: { kind: Service, name: monitoring-proxy }  # forwards to the monitoring proxy, which forwards to Flower
  port: { targetPort: http }                     # on its http port
  tls: { termination: edge, insecureEdgeTerminationPolicy: Redirect }   # https at the router; http is redirected to https

# ---------------------------------------------------------------- network rules: TSG's monitoring pods only
# They select only pods labelled part-of=tsg-monitoring: the chatbot's pods in this project are not touched.
---
apiVersion: networking.k8s.io/v1                 # NetworkPolicy API version
kind: NetworkPolicy                              # a firewall rule for pods
metadata:                                        # the object's name and place
  name: monitoring-from-proxy                    # rule name
  namespace: ai-common                           # project
  labels: { part-of: tsg-monitoring }            # marks it as TSG's monitoring
spec:                                            # the rule
  podSelector: { matchLabels: { part-of: tsg-monitoring } }   # applies to TSG's monitoring pods only
  policyTypes: [Ingress]                         # controls incoming connections
  ingress:                                       # allowed incoming connections
    - from:                                      # the monitoring proxy (Grafana and Flower's public addresses, in ai-threatgen)
        - namespaceSelector: {}                  # any project ...
          podSelector: { matchLabels: { app: monitoring-proxy, part-of: tsg-monitoring } }   # ... but only the monitoring proxy
      ports:                                     # to these ports only
        - { port: 3000, protocol: TCP }          # Grafana
        - { port: 5555, protocol: TCP }          # Flower
---
apiVersion: networking.k8s.io/v1                 # NetworkPolicy API version
kind: NetworkPolicy                              # a firewall rule for pods
metadata:                                        # the object's name and place
  name: monitoring-from-project                  # rule name
  namespace: ai-common                           # project
  labels: { part-of: tsg-monitoring }            # marks it as TSG's monitoring
spec:                                            # the rule
  podSelector: { matchLabels: { part-of: tsg-monitoring } }   # applies to TSG's monitoring pods only
  policyTypes: [Ingress]                         # controls incoming connections
  ingress:                                       # allowed incoming connections
    - from:                                      # pods of this project (Grafana to Prometheus, Alloy to Loki, Prometheus to every exporter)
        - podSelector: {}                        # any pod in this project
