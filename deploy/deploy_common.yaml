# deploy_common.yaml - TSG's monitoring and Flower in project ai-common (UAT is production): Prometheus (metrics
# and alert rules), Alertmanager (firing alerts), Loki (logs), Alloy (ships the pods' logs to Loki), Grafana (the
# one place to look), redis-exporter (jobs waiting per queue), kube-state-metrics (restarts, OOM kills) and Flower
# (the live view of the background jobs); their volumes, Services and network rules; the monitoring proxy and its
# Routes in ai-threatgen (Grafana and Flower on the API's address); and the read-only access they need in
# ai-threatgen and ai-remediation. Config files: configmap.yaml. Passwords: secrets.yaml.
#
# Public addresses, without login (owner's decision), on the API's own host. OpenShift gives a host to one project
# only, so their Routes are in ai-threatgen and go through the monitoring proxy there (nginx, below):
#   https://threatgen-api.apps.dda-desc-az1-01.desccii.local/grafana/   Grafana: the one place to look
#   https://threatgen-api.apps.dda-desc-az1-01.desccii.local/flower/    Flower: background jobs (view only)
# No login means anyone who can reach the API's host can read every log line and metric: Grafana's anonymous
# viewer may send any Loki or Prometheus query through its query API (POST /grafana/api/ds/query).
# Prometheus, Alertmanager and Loki have no public address: open them with oc port-forward (the guide's Part 3).
#
# Apply AFTER configmap.yaml, secrets.yaml and networkpolicy_threatgen.yaml, and after deploy_threatgen.yaml is
# rolled out (its smaller beat makes room for the proxy in ai-threatgen's quota):
#   oc apply -f deploy/deploy_common.yaml
#   oc -n ai-common rollout status deployment -l part-of=tsg-monitoring --watch
#   oc -n ai-threatgen rollout status deployment/monitoring-proxy
# A running pod never sees a changed config file or password: after a change, restart TSG's monitoring pods
# (the -l keeps the chatbot's pods in this project running), and the proxy in ai-threatgen:
#   oc -n ai-common rollout restart deployment -l part-of=tsg-monitoring
#   oc -n ai-threatgen rollout restart deployment/monitoring-proxy
# New release: Flower runs from the app image, so its tag (24-Oct-2026) changes with the deploy_*.yaml files.
#
# BEFORE THE FIRST APPLY - images. The cluster pulls only from Quay
# (quay-quay-registry.apps.dda-desc-az1-01.desccii.local/dda-desc). The 8 monitoring images are built on Red Hat
# UBI 9 (registry.access.redhat.com/ubi9:latest) by deploy\build-monitoring-images.bat from each program's
# official release (kube-state-metrics from its source; nginx is Red Hat's own UBI 9 nginx image), and pushed to
# Quay under the names below.
# Change a version by changing its image: line, then run: deploy\build-monitoring-images.bat <name>
# (kube-state-metrics also needs SRC_SHA256 in deploy/images/kube-state-metrics/Dockerfile: the new tag's sha256).
# The version on each image line is the one pin: scripts/monitoring.py installs the same versions on a laptop.
#
# FIRST TIME ONLY (deploy/DEPLOYMENT_GUIDE.md, Part 2, step 9): a Deployment's selector cannot change, so the
# older copies go first. The old monitoring ran in ai-remediation: delete it there by name:
#   oc -n ai-remediation delete deployment prometheus alertmanager loki alloy grafana redis-exporter kube-state-metrics flower --ignore-not-found
#   oc -n ai-remediation delete route grafana prometheus alertmanager loki flower --ignore-not-found
# In ai-common, shared with the chatbot, step 9 deletes by label, never by name: TSG's older copies of these
# Deployments and their Routes (labelled part-of=tsg-observability under the older label prefix: TSG's, not the
# chatbot's), and the previous release's Routes on the threatgen-grafana host (the new Routes live in ai-threatgen):
#   oc -n ai-common delete route -l part-of=tsg-monitoring
# The old volumes in ai-remediation (prometheus-data, loki-data, grafana-data) stay until the owner deletes them.
# If "oc apply" here says "field is immutable", an older copy of that Deployment is still in ai-common: step 9.
#
# Budget: ai-common's quota is 6 CPU, 16 Gi memory, 180 Gi storage, shared with the chatbot; TSG keeps to 3 CPU,
# 6 Gi and 60 Gi. These pods' limits: about 2.3 CPU and 4.1 Gi; a restart adds up to 0.5 CPU and 1.1 Gi (one new
# pod each for alertmanager, redis-exporter, kube-state-metrics and flower); volumes 21 Gi.
# Security: Flower and redis-exporter read tsg-secrets here, so whoever may read Secrets in ai-common can read
# TSG's passwords and keys.
# Step by step: deploy/DEPLOYMENT_GUIDE.md

# ---------------------------------------------------------------- access: read-only, namespaced, no cluster rights
# Prometheus finds the pods to scrape, Alloy reads their logs, kube-state-metrics watches them.
apiVersion: v1                                   # core API version
kind: ServiceAccount                             # the identity Prometheus runs as
metadata:                                        # the object's name and place
  name: prometheus                               # ServiceAccount name
  namespace: ai-common                           # project
  labels: { part-of: tsg-monitoring }            # marks it as TSG's monitoring
---
apiVersion: rbac.authorization.k8s.io/v1         # access rules API version
kind: Role                                       # what may be done in this project
metadata:                                        # the object's name and place
  name: prometheus-find-pods                     # Role name
  namespace: ai-common                           # project
  labels: { part-of: tsg-monitoring }            # marks it as TSG's monitoring
rules:                                           # the allowed actions
  - apiGroups: [""]                              # core objects
    resources: [pods]                            # pods only
    verbs: [get, list, watch]                    # read them, nothing else
---
apiVersion: rbac.authorization.k8s.io/v1         # access rules API version
kind: RoleBinding                                # gives the Role to an identity
metadata:                                        # the object's name and place
  name: prometheus-find-pods                     # RoleBinding name
  namespace: ai-common                           # project
  labels: { part-of: tsg-monitoring }            # marks it as TSG's monitoring
roleRef:                                         # the Role given
  apiGroup: rbac.authorization.k8s.io            # access rules API group
  kind: Role                                     # a Role in this project
  name: prometheus-find-pods                     # the Role above
subjects:                                        # who gets it
  - kind: ServiceAccount                         # an identity pods run as
    name: prometheus                             # the prometheus ServiceAccount
    namespace: ai-common                         # in this project

