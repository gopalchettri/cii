  name: loki                                     # ServiceAccount name
  namespace: ai-common                           # project
  labels: { part-of: tsg-monitoring }            # marks it as TSG's monitoring
automountServiceAccountToken: false              # Loki never calls the OpenShift API: no token in its pod
---
apiVersion: v1                                   # core API version
