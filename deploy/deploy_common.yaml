  name: grafana                                  # ServiceAccount name
  namespace: ai-common                           # project
  labels: { part-of: tsg-monitoring }            # marks it as TSG's monitoring
automountServiceAccountToken: false              # Grafana never calls the OpenShift API: no token in its pod

