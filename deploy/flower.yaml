# Flower (the live view of the background jobs) on OpenShift, project ai-common, beside the rest of the
# monitoring: https://threatgen-grafana.apps.dda-desc-az1-01.desccii.local/flower/ (public, no login, owner
# 2026-10-08; Flower switches its own API off without a login, so it is view only).
#
# It runs from the app image and reads the app's settings (tsg-config, tsg-secrets: the job queue's address; the
# app checks every required setting at start, so the whole Secret is copied here: whoever may read Secrets in
# ai-common can read the app's passwords). deploy/deploy-uat.ps1 applies it with the image it deploys: it
# replaces tsg-api:v2-COMMIT below with the build's tag and `none` with the settings fingerprint. By hand: put
# the image's tag in place of COMMIT.
# A live view only: Flower's history is not a record (the runs and the audit live in MongoDB). No volume, no
# disruption budget. Labelled as monitoring (tsg-observability), so the monitoring's network rules cover it.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: flower
  namespace: ai-common
  labels: { app.kubernetes.io/name: flower, app.kubernetes.io/part-of: tsg-observability }
spec:
  replicas: 1 # two would each read the job events and show half a picture
  selector:
    matchLabels: { app.kubernetes.io/name: flower }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flower
        app.kubernetes.io/component: flower
        app.kubernetes.io/part-of: tsg-observability
        tsg-observability: "true"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "5555"
        prometheus.io/path: /flower/metrics
        tsg/settings-fingerprint: none
    spec:
      automountServiceAccountToken: false
      imagePullSecrets: [{ name: quay-pull }]
      containers:
        - name: flower
          image: quay-quay-registry.apps.dda-desc-az1-01.desccii.local/dda-desc/tsg-api:v2-COMMIT
          imagePullPolicy: IfNotPresent
          command: [celery, -A, app.worker, flower, --address=0.0.0.0, --port=5555, --url_prefix=flower]
          envFrom:
            - configMapRef: { name: tsg-config }
            - secretRef: { name: tsg-secrets }
          ports: [{ name: http, containerPort: 5555 }]
          readinessProbe:
            tcpSocket: { port: 5555 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: 5555 }
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 200m, memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities: { drop: [ALL] }
            seccompProfile: { type: RuntimeDefault }

---
apiVersion: v1
kind: Service
metadata:
  name: flower
  namespace: ai-common
spec:
  selector: { app.kubernetes.io/name: flower }
  ports: [{ name: http, port: 5555, targetPort: 5555 }]

---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: flower
  namespace: ai-common
  labels: { app.kubernetes.io/part-of: tsg-observability }
spec:
  host: threatgen-grafana.apps.dda-desc-az1-01.desccii.local
  path: /flower
  to: { kind: Service, name: flower }
  port: { targetPort: http }
  tls: { termination: edge, insecureEdgeTerminationPolicy: Redirect }
