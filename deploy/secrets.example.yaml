# secrets.example.yaml - the TEMPLATE for secrets.yaml: every password, key and connection string TSG needs.
# This file is in git and holds no real secret. Never put a real value in it.
#   1. Copy it:  copy deploy\secrets.example.yaml deploy\secrets.yaml   (secrets.yaml is in .gitignore)
#   2. In secrets.yaml, replace every CHANGE_ME with the real value (hosts and ports are already filled in).
#   3. Apply:    oc apply -f deploy/secrets.yaml
#   4. After a later change, restart TSG's pods (only TSG's: the chatbot runs in ai-common too):
#        oc -n ai-remediation rollout restart deployment -l part-of=tsg
#        oc -n ai-threatgen rollout restart deployment -l part-of=tsg
#        oc -n ai-common rollout restart deployment -l part-of=tsg-monitoring
# The image pull secret (quay-pull) is not here: see Part 2, step 6 of deploy/DEPLOYMENT_GUIDE.md.
# Step by step: deploy/DEPLOYMENT_GUIDE.md

apiVersion: v1                                   # core API version
kind: List                                       # several objects in one document, so the secrets are written once
items:                                           # one tsg-secrets per project that runs TSG pods, the Redis logins, then Grafana's
  - apiVersion: v1                               # core API version
    kind: Secret                                 # values OpenShift keeps apart from the plain settings
    type: Opaque                                 # free-form keys and values
    metadata:                                    # the object's name and place
      name: tsg-secrets                          # the name every TSG pod reads its secrets from (envFrom)
      namespace: ai-threatgen                    # the API, one worker per queue and beat run here
      labels: { part-of: tsg }                   # marks it as TSG's
    stringData: &secrets                         # plain text here (OpenShift encodes it); "&secrets" is reused below
      CII_DB_DSN: "mssql+pyodbc://CHANGE_ME_USER:CHANGE_ME_PASSWORD@10.228.146.2:1444/EYShieldDB_UAT_Copy?driver=ODBC+Driver+17+for+SQL+Server&Encrypt=yes&TrustServerCertificate=yes"   # SQL Server: the library and the asset facts
      CII_MONGO_URL: "mongodb://CHANGE_ME_USER:CHANGE_ME_PASSWORD@10.228.146.3:27018/?authSource=admin&directConnection=true"   # MongoDB: every run, scenario, plan and job
      CII_CHAT_API_KEY: "CHANGE_ME"              # AI gateway key for the chat models
      CII_EMBEDDING_API_KEY: "CHANGE_ME"         # AI gateway key for the embedding model
      CII_RERANK_API_KEY: "CHANGE_ME"            # AI gateway key for the re-ranking model
      CII_ADMIN_API_KEY: "CHANGE_ME_ADMIN_KEY_32_OR_MORE_CHARACTERS"   # admin key (X-Admin-Key): 32 characters or more
      CII_NVD_API_KEY: "CHANGE_ME"               # NVD feed key (raises its rate limit); "" = no key
      CII_PROXY_URL: ""                          # proxy override for the app; empty in production (the pods' HTTPS_PROXY is used)
  - apiVersion: v1                               # core API version
    kind: Secret                                 # values OpenShift keeps apart from the plain settings
    type: Opaque                                 # free-form keys and values
    metadata:                                    # the object's name and place
      name: tsg-secrets                          # the same name, read the same way
      namespace: ai-remediation                  # the second copy of every worker runs here
      labels: { part-of: tsg }                   # marks it as TSG's
    stringData: *secrets                         # "*secrets" = exactly the values written above
  - apiVersion: v1                               # core API version
    kind: Secret                                 # values OpenShift keeps apart from the plain settings
    type: Opaque                                 # free-form keys and values
    metadata:                                    # the object's name and place
      name: tsg-secrets                          # the same name, read the same way
      namespace: ai-common                       # Flower reads it (anyone who may read Secrets here can read these)
      labels: { part-of: tsg }                   # marks it as TSG's
    stringData: *secrets                         # "*secrets" = exactly the values written above
  # Redis logins: one Redis user per component, each in its own Secret that only that component's pods read, so
  # one leaked or changed password touches one component, and Redis' ACL LOG and CLIENT LIST name who did what.
  # rediss:// = TLS: every client checks Redis' certificate and host name (a private CA: CII_REDIS_CA_FILE in
  # configmap.yaml). Write redis:// instead only while the Redis owner has not turned TLS on.
  - apiVersion: v1                               # core API version
    kind: Secret                                 # values OpenShift keeps apart from the plain settings
    type: Opaque                                 # free-form keys and values
    metadata:                                    # the object's name and place
      name: tsg-redis-api                        # the API's Redis login (envFrom in deploy_threatgen.yaml)
      namespace: ai-threatgen                    # its pods run here
      labels: { part-of: tsg }                   # marks it as TSG's
    stringData:                                  # plain text here (OpenShift encodes it)
      CII_REDIS_URL: "rediss://CHANGE_ME_API_USER:CHANGE_ME_API_PASSWORD@10.228.146.4:6379/0"   # Redis database 0: live updates and caches
      CII_REDIS_CELERY_BROKER_URL: "rediss://CHANGE_ME_API_USER:CHANGE_ME_API_PASSWORD@10.228.146.4:6379/1"   # Redis database 1: the job queues
  - apiVersion: v1                               # core API version
    kind: Secret                                 # values OpenShift keeps apart from the plain settings
    type: Opaque                                 # free-form keys and values
    metadata:                                    # the object's name and place
      name: tsg-redis-worker                     # the workers' Redis login (envFrom in deploy_*.yaml)
      namespace: ai-threatgen                    # its pods run here
      labels: { part-of: tsg }                   # marks it as TSG's
    stringData: &worker-redis                    # plain text here (OpenShift encodes it); "&worker-redis" is reused below
      CII_REDIS_URL: "rediss://CHANGE_ME_WORKER_USER:CHANGE_ME_WORKER_PASSWORD@10.228.146.4:6379/0"   # Redis database 0: live updates and caches
      CII_REDIS_CELERY_BROKER_URL: "rediss://CHANGE_ME_WORKER_USER:CHANGE_ME_WORKER_PASSWORD@10.228.146.4:6379/1"   # Redis database 1: the job queues
  - apiVersion: v1                               # core API version
    kind: Secret                                 # values OpenShift keeps apart from the plain settings
    type: Opaque                                 # free-form keys and values
    metadata:                                    # the object's name and place
      name: tsg-redis-worker                     # the same login for the workers here
      namespace: ai-remediation                  # its pods run here
      labels: { part-of: tsg }                   # marks it as TSG's
    stringData: *worker-redis                    # "*worker-redis" = exactly the login written above
  - apiVersion: v1                               # core API version
    kind: Secret                                 # values OpenShift keeps apart from the plain settings
    type: Opaque                                 # free-form keys and values
    metadata:                                    # the object's name and place
      name: tsg-redis-beat                       # beat's Redis login: it only sends the timed jobs
      namespace: ai-threatgen                    # its pods run here
      labels: { part-of: tsg }                   # marks it as TSG's
    stringData:                                  # plain text here (OpenShift encodes it)
      CII_REDIS_URL: "rediss://CHANGE_ME_BEAT_USER:CHANGE_ME_BEAT_PASSWORD@10.228.146.4:6379/0"   # Redis database 0: live updates and caches
      CII_REDIS_CELERY_BROKER_URL: "rediss://CHANGE_ME_BEAT_USER:CHANGE_ME_BEAT_PASSWORD@10.228.146.4:6379/1"   # Redis database 1: the job queues
  - apiVersion: v1                               # core API version
    kind: Secret                                 # values OpenShift keeps apart from the plain settings
    type: Opaque                                 # free-form keys and values
    metadata:                                    # the object's name and place
      name: tsg-redis-flower                     # Flower's Redis login: it reads the job queues and events
      namespace: ai-common                       # its pods run here
      labels: { part-of: tsg }                   # marks it as TSG's
    stringData:                                  # plain text here (OpenShift encodes it)
      CII_REDIS_URL: "rediss://CHANGE_ME_FLOWER_USER:CHANGE_ME_FLOWER_PASSWORD@10.228.146.4:6379/0"   # Redis database 0: live updates and caches
      CII_REDIS_CELERY_BROKER_URL: "rediss://CHANGE_ME_FLOWER_USER:CHANGE_ME_FLOWER_PASSWORD@10.228.146.4:6379/1"   # Redis database 1: the job queues
  - apiVersion: v1                               # core API version
    kind: Secret                                 # values OpenShift keeps apart from the plain settings
    type: Opaque                                 # free-form keys and values
    metadata:                                    # the object's name and place
      name: tsg-redis-exporter                   # redis-exporter's Redis login: a READ-ONLY user
      namespace: ai-common                       # its pods run here
      labels: { part-of: tsg }                   # marks it as TSG's
    stringData:                                  # plain text here (OpenShift encodes it)
      REDIS_ADDR: "rediss://CHANGE_ME_EXPORTER_USER:CHANGE_ME_EXPORTER_PASSWORD@10.228.146.4:6379/1"   # the Redis it reads (deploy_common.yaml); queue lengths in database 1
  - apiVersion: v1                               # core API version
    kind: Secret                                 # Grafana's admin password and the alert email passwords
    type: Opaque                                 # free-form keys and values
    metadata:                                    # the object's name and place
      name: tsg-monitoring                       # read by the grafana and alertmanager Deployments (deploy_common.yaml)
      namespace: ai-common                       # the monitoring's project
      labels: { part-of: tsg-monitoring }        # marks it as TSG's monitoring
    stringData:                                  # plain text here (OpenShift encodes it)
      GF_SECURITY_ADMIN_PASSWORD: "CHANGE_ME_16_OR_MORE_CHARACTERS"   # Grafana "admin" login, only to change Grafana; viewing needs none
      SMTP_RELAY_PASSWORD: "CHANGE_ME"           # alert email through the company relay (alertmanager.yml company-smtp); not used: ""
      GMAIL_APP_PASSWORD: "CHANGE_ME"            # alert email through Gmail: a Google app password (alertmanager.yml gmail); not used: ""
