# deploy_threatgen.yaml - TSG in project ai-threatgen (UAT is production): the API (2 copies), one worker per
# queue (threats, scenarios, controls, remediation, service mapper, maintenance, reaper), beat (the timer), the
# API's Service, Route (https://threatgen-api.apps.dda-desc-az1-01.desccii.local) and its disruption budget.
# Network rules: networkpolicy_threatgen.yaml. Settings: configmap.yaml, secrets.yaml.
# Apply AFTER deploy_remediation.yaml is rolled out (new workers before a new API), and wait until it is rolled out:
#   oc apply -f deploy/deploy_threatgen.yaml
#   oc -n ai-threatgen rollout status deployment -l part-of=tsg --timeout=10m
# New release: replace the image tag (24-Oct-2026) everywhere in deploy_*.yaml with the one build-image.bat printed.
# Quota here: 6 CPU, 12 Gi memory (limits). These pods use 5.2 CPU and 10.88 Gi, with the monitoring proxy
# (deploy_common.yaml) 5.25 CPU and 10.94 Gi; an API update adds one API pod (6 CPU, 11.94 Gi).
# A worker update stops the old pod first (maxSurge 0): its twin in ai-remediation serves meanwhile.
# A stopping pod still counts against the quota until it has exited (a worker may take 2 minutes), so during an
# update a new pod can be refused for a while ("exceeded quota" in the events). OpenShift retries and creates it
# once the old pod is gone: rollout status only takes longer.
# A worker is ready once its heartbeat has written /tmp/tsg-worker-alive (startupProbe).
# Each worker prefers a node its twin in ai-remediation is not on, and the two API pods different nodes, so one node
# failure stops neither a queue nor the API (preferred only: a pod still starts when no other node fits).
# Step by step: deploy/DEPLOYMENT_GUIDE.md

# ---------------------------------------------------------------- the API
apiVersion: apps/v1                              # Deployment API version
kind: Deployment                                 # keeps the wanted number of API pods running
metadata:                                        # the object's name and place
  name: api                                      # Deployment name
  namespace: ai-threatgen                        # project
  labels: { app: api, part-of: tsg }             # labels on the Deployment itself
spec:                                            # what to run
  replicas: 2                                    # two copies: one can stop while the other serves
  strategy:                                      # how an update replaces pods
    type: RollingUpdate                          # one pod at a time
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }   # start the new pod first, then stop an old one: no gap
  selector:                                      # which pods belong to this Deployment
    matchLabels: { app: api }                    # pods labelled app=api (cannot change after creation)
  template:                                      # the pod to run
    metadata:                                    # pod labels and notes
      labels: { app: api, component: api, part-of: tsg }   # component becomes Prometheus' job name; part-of selects the network rules
      annotations:                               # notes read by Prometheus
        prometheus.io/scrape: "true"             # Prometheus collects this pod's metrics
        prometheus.io/port: "8000"               # on this port
        prometheus.io/path: /metrics             # at this path
    spec:                                        # pod settings
      enableServiceLinks: false                  # no <SERVICE>_PORT variables from the project's Services (Flower read FLOWER_PORT as its port)
      automountServiceAccountToken: false        # the app never calls the OpenShift API: no token in the pod
      hostAliases: [{ ip: "10.231.255.253", hostnames: [llmapi.govai.ae] }]   # cluster DNS cannot resolve the AI gateway: its address is fixed here
      imagePullSecrets: [{ name: quay-pull }]    # login for the image registry (Quay)
      terminationGracePeriodSeconds: 40          # time a stopping pod gets to finish open requests
      affinity:                                  # where the scheduler places the pod
        podAntiAffinity:                         # away from some other pods
          preferredDuringSchedulingIgnoredDuringExecution:   # a wish, not a must: the pod still starts on a busy cluster and as the update's extra pod
            - weight: 100                        # the strongest wish
              podAffinityTerm:                   # the pods to keep away from
                labelSelector: { matchLabels: { app: api } }   # the other API pod, in this project only (no namespaces line)
                topologyKey: kubernetes.io/hostname   # on another node: one node failure leaves an API pod serving (D29)
      containers:                                # the programs in the pod
        - name: api                              # container name
          image: quay-quay-registry.apps.dda-desc-az1-01.desccii.local/dda-desc/tsg-api:24-Oct-2026   # the TSG image (change the tag per release)
          imagePullPolicy: IfNotPresent          # a tag never changes content: pull only if missing
          command: [uvicorn, app.main:app, --host, 0.0.0.0, --port, "8000", --proxy-headers, "--forwarded-allow-ips=*", --no-access-log, --timeout-graceful-shutdown, "30"]   # start the web API on port 8000
          envFrom:                               # every setting, as environment variables
            - configMapRef: { name: tsg-config }   # plain settings (configmap.yaml)
            - secretRef: { name: tsg-secrets }     # passwords, keys, connection strings (secrets.yaml)
          env:                                   # the corporate proxy
            - { name: HTTP_PROXY, value: "http://10.61.192.2:8080" }    # outside http calls (intelligence feeds) go through the proxy
            - { name: HTTPS_PROXY, value: "http://10.61.192.2:8080" }   # outside https calls go through the proxy
            - { name: NO_PROXY, value: "localhost,127.0.0.1,.svc,.cluster.local,llmapi.govai.ae" }   # never via the proxy: local, cluster and the AI gateway
            - { name: no_proxy, value: "localhost,127.0.0.1,.svc,.cluster.local,llmapi.govai.ae" }   # the same list in lower case (some tools read only this)
          ports: [{ name: http, containerPort: 8000 }]   # the API's port
          readinessProbe:                        # "ready" = may receive requests
            httpGet: { path: /ready, port: 8000 }   # every store answers and every queue has a live worker
            initialDelaySeconds: 10              # first check after 10 s
            periodSeconds: 10                    # then every 10 s
            timeoutSeconds: 7                    # each check may take 7 s
            failureThreshold: 12                 # 12 failures in a row (2 minutes) = not ready: a short store or worker gap leaves the API serving
          livenessProbe:                         # "alive" = the process answers; failing restarts the container
            httpGet: { path: /health, port: 8000 }   # no store calls, so a store outage never restarts a healthy pod
            initialDelaySeconds: 30              # first check after 30 s
            periodSeconds: 20                    # then every 20 s
            timeoutSeconds: 2                    # each check may take 2 s
            failureThreshold: 3                  # 3 failures in a row = restart
          lifecycle:                             # actions at stop
            preStop: { exec: { command: [sleep, "5"] } }   # wait 5 s so the router stops sending requests first
          resources:                             # CPU and memory
            requests: { cpu: 250m, memory: 512Mi }   # reserved for the pod
            limits: { cpu: 750m, memory: 1Gi }       # the most it may use
          securityContext:                       # locked down
            allowPrivilegeEscalation: false      # cannot gain more rights
            runAsNonRoot: true                   # never runs as root
            capabilities: { drop: [ALL] }        # no special Linux rights
            seccompProfile: { type: RuntimeDefault }   # the default system-call filter

# ---------------------------------------------------------------- workers: one Deployment per queue
# A stopped worker loses nothing: once its job's lease runs out, the reaper re-sends the job to another worker.
---
apiVersion: apps/v1                              # Deployment API version
kind: Deployment                                 # keeps one threat-finding worker running
metadata:                                        # the object's name and place
  name: worker-threats                           # Deployment name
  namespace: ai-threatgen                        # project
  labels: { app: worker-threats, part-of: tsg }  # labels on the Deployment itself
spec:                                            # what to run
  replicas: 1                                    # one here; its twin runs in ai-remediation
  strategy:                                      # how an update replaces the pod
    type: RollingUpdate                          # replace the pod
    rollingUpdate: { maxUnavailable: 1, maxSurge: 0 }   # stop the old pod first: no extra pod in the quota
  selector:                                      # which pods belong to this Deployment
    matchLabels: { app: worker-threats }         # pods labelled app=worker-threats
  template:                                      # the pod to run
    metadata:                                    # pod labels and notes
      labels: { app: worker-threats, component: worker, part-of: tsg }   # component becomes Prometheus' job name
      annotations:                               # notes read by Prometheus
        prometheus.io/scrape: "true"             # Prometheus collects this pod's metrics
        prometheus.io/port: "9100"               # on this port
        prometheus.io/path: /metrics             # at this path
    spec:                                        # pod settings
      enableServiceLinks: false                  # no <SERVICE>_PORT variables from the project's Services (Flower read FLOWER_PORT as its port)
      automountServiceAccountToken: false        # the app never calls the OpenShift API
      hostAliases: [{ ip: "10.231.255.253", hostnames: [llmapi.govai.ae] }]   # the AI gateway's fixed address
      imagePullSecrets: [{ name: quay-pull }]    # login for the image registry
      terminationGracePeriodSeconds: 120         # time a stopping worker gets to finish its AI calls
      affinity:                                  # where the scheduler places the pod
        podAntiAffinity:                         # away from some other pods
          preferredDuringSchedulingIgnoredDuringExecution:   # a wish, not a must: the pod still starts when no other node fits
            - weight: 100                        # the strongest wish
              podAffinityTerm:                   # the pods to keep away from
                labelSelector: { matchLabels: { app: worker-threats } }   # this worker's twin (and any extra copy)
                namespaces: [ai-threatgen, ai-remediation]   # in both projects: the twin runs in the other one
                topologyKey: kubernetes.io/hostname   # on another node: one node failure leaves the queue served (D29)
      containers:                                # the programs in the pod
        - name: worker                           # container name
          image: quay-quay-registry.apps.dda-desc-az1-01.desccii.local/dda-desc/tsg-api:24-Oct-2026   # the TSG image (change the tag per release)
          imagePullPolicy: IfNotPresent          # pull only if missing
          command: [celery, -A, app.worker, worker, --pool=threads, -c, "2", -Q, tsg_threats]   # 2 threads on the tsg_threats queue
          envFrom:                               # every setting, as environment variables
            - configMapRef: { name: tsg-config }   # plain settings
            - secretRef: { name: tsg-secrets }     # secrets
          env:                                   # the corporate proxy
            - { name: HTTP_PROXY, value: "http://10.61.192.2:8080" }    # outside http calls go through the proxy
            - { name: HTTPS_PROXY, value: "http://10.61.192.2:8080" }   # outside https calls go through the proxy
            - { name: NO_PROXY, value: "localhost,127.0.0.1,.svc,.cluster.local,llmapi.govai.ae" }   # never via the proxy (AI gateway included)
            - { name: no_proxy, value: "localhost,127.0.0.1,.svc,.cluster.local,llmapi.govai.ae" }   # the same list in lower case
          ports: [{ name: metrics, containerPort: 9100 }]   # the worker's metrics port
          startupProbe:                          # "started" = its heartbeat wrote the alive file; until then the pod is not ready
            exec: { command: [sh, -c, 'test -f /tmp/tsg-worker-alive'] }   # the file the worker's heartbeat touches
            initialDelaySeconds: 20              # first check after 20 s
            periodSeconds: 15                    # then every 15 s until it answers
            timeoutSeconds: 30                   # each check may take 30 s
            failureThreshold: 20                 # no answer within about 5 minutes = restart
          livenessProbe:                         # "alive" = its heartbeat touched the file in the last 3 minutes; no Redis, so an outage restarts no worker
            exec: { command: [sh, -c, 'test $(( $(date +%s) - $(stat -c %Y /tmp/tsg-worker-alive) )) -lt 180'] }   # the file's age in seconds; no file fails too
            initialDelaySeconds: 120             # first check after 2 minutes
            periodSeconds: 60                    # then every minute
            timeoutSeconds: 30                   # each check may take 30 s
            failureThreshold: 3                  # 3 failures in a row = restart
          resources:                             # CPU and memory
            requests: { cpu: 500m, memory: 1Gi }   # reserved for the pod
            limits: { cpu: "1", memory: 1536Mi }   # the most it may use
          securityContext:                       # locked down
            allowPrivilegeEscalation: false      # cannot gain more rights
            runAsNonRoot: true                   # never runs as root
            capabilities: { drop: [ALL] }        # no special Linux rights
            seccompProfile: { type: RuntimeDefault }   # the default system-call filter

