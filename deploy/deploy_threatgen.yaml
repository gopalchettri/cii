# ---------------------------------------------------------------- beat: the timer (exactly one, only here)
# Two beats would send every scheduled job twice: never scale it above 1, never copy it to another project.
---
apiVersion: apps/v1                              # Deployment API version
kind: Deployment                                 # keeps the one timer running
metadata:                                        # the object's name and place
  name: beat                                     # Deployment name
  namespace: ai-threatgen                        # project
  labels: { app: beat, part-of: tsg }            # labels on the Deployment itself
spec:                                            # what to run
  replicas: 1                                    # exactly one
  strategy: { type: Recreate }                   # the old pod is gone before the new one starts: never two at once
  selector:                                      # which pods belong to this Deployment
    matchLabels: { app: beat }                   # pods labelled app=beat
  template:                                      # the pod to run
    metadata:                                    # pod labels
      labels: { app: beat, component: beat, part-of: tsg }   # component names it in the logs
    spec:                                        # pod settings
      automountServiceAccountToken: false        # the app never calls the OpenShift API
      hostAliases: [{ ip: "10.231.255.253", hostnames: [llmapi.govai.ae] }]   # the AI gateway's fixed address
      imagePullSecrets: [{ name: quay-pull }]    # login for the image registry
      containers:                                # the programs in the pod
        - name: beat                             # container name
          image: quay-quay-registry.apps.dda-desc-az1-01.desccii.local/dda-desc/tsg-api:24-Oct-2026   # the TSG image (change the tag per release)
          imagePullPolicy: IfNotPresent          # pull only if missing
          command: [celery, -A, app.worker, beat, -s, /tmp/beat/schedule]   # the timer; it keeps its schedule file in /tmp/beat
          envFrom:                               # every setting, as environment variables
            - configMapRef: { name: tsg-config }   # plain settings
            - secretRef: { name: tsg-secrets }     # secrets
          env:                                   # the corporate proxy
            - { name: HTTP_PROXY, value: "http://10.61.192.2:8080" }    # outside http calls go through the proxy
            - { name: HTTPS_PROXY, value: "http://10.61.192.2:8080" }   # outside https calls go through the proxy
            - { name: NO_PROXY, value: "localhost,127.0.0.1,.svc,.cluster.local,llmapi.govai.ae" }   # never via the proxy (AI gateway included)
            - { name: no_proxy, value: "localhost,127.0.0.1,.svc,.cluster.local,llmapi.govai.ae" }   # the same list in lower case
          livenessProbe:                         # "alive" = it saved its schedule in the last 6 minutes (it saves every ~3)
            exec: { command: [sh, -c, "find /tmp/beat -name 'schedule*' -newermt '-360 seconds' | grep -q ."] }   # look for a recent schedule file
            initialDelaySeconds: 60              # first check after 1 minute
            periodSeconds: 30                    # then every 30 s
            timeoutSeconds: 10                   # each check may take 10 s
            failureThreshold: 3                  # 3 failures in a row = restart
          volumeMounts: [{ name: schedule, mountPath: /tmp/beat }]   # where the schedule file is written
          resources:                             # CPU and memory
            requests: { cpu: 50m, memory: 320Mi }  # reserved for the pod
            limits: { cpu: 250m, memory: 512Mi }   # the most it may use
          securityContext:                       # locked down
            allowPrivilegeEscalation: false      # cannot gain more rights
            runAsNonRoot: true                   # never runs as root
            capabilities: { drop: [ALL] }        # no special Linux rights
            seccompProfile: { type: RuntimeDefault }   # the default system-call filter
      volumes: [{ name: schedule, emptyDir: {} }]   # a scratch folder; a new pod simply starts a fresh schedule

# ---------------------------------------------------------------- how the API is reached
---
apiVersion: v1                                   # core API version
kind: Service                                    # one stable address in front of the API pods
metadata:                                        # the object's name and place
  name: api                                      # Service name (the Route below points here)
  namespace: ai-threatgen                        # project
  labels: { part-of: tsg }                       # marks it as TSG's
spec:                                            # what it does
  selector: { app: api }                         # sends traffic to the pods labelled app=api
  ports: [{ name: http, port: 8000, targetPort: 8000 }]   # port 8000 to the pods' port 8000

---
apiVersion: route.openshift.io/v1                # OpenShift Route API version
kind: Route                                      # the public https address
metadata:                                        # the object's name and place
  name: api                                      # Route name
  namespace: ai-threatgen                        # project
  labels: { part-of: tsg }                       # marks it as TSG's
spec:                                            # what it does
  host: threatgen-api.apps.dda-desc-az1-01.desccii.local   # the address callers use
  path: /                                        # every path
  to: { kind: Service, name: api }               # forwards to the api Service
  port: { targetPort: http }                     # on its http port
  tls: { termination: edge, insecureEdgeTerminationPolicy: Redirect }   # https at the router; http is redirected to https

# A node drain (cluster maintenance) never stops both API pods at once.
---
apiVersion: policy/v1                            # disruption budget API version
kind: PodDisruptionBudget                        # limits voluntary stops
metadata:                                        # the object's name and place
  name: api                                      # budget name
  namespace: ai-threatgen                        # project
  labels: { part-of: tsg }                       # marks it as TSG's
spec:                                            # the rule
  minAvailable: 1                                # at least one API pod stays up
  selector: { matchLabels: { app: api } }        # for the pods labelled app=api
